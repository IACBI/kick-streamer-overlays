<!DOCTYPE html>
<html lang="tr">
<head>
<!-- Kick Overlay Studio: choose a look, preview it, copy a link for each overlay and paste it into OBS.
     Preview sizes match OBS: follower-bar 520x90, subscriber-bar 520x90, combined-bar 520x180,
     info-panel 300x80, countdown 520x190, ticker 760x80, chat 460x760. -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Overlay Studio</title>
<link rel="icon" href="branding/logo.svg" type="image/svg+xml">
<link rel="icon" href="branding/logo-512.png" type="image/png" sizes="512x512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.relay.js"></script>
<script src="shared/lang/tr.js"></script>
<script src="shared/lang/en.js"></script>
<script src="shared/lang/es.js"></script>
<script src="shared/lang/pt.js"></script>
<script src="shared/lang/de.js"></script>
<script src="shared/lang/ar.js"></script>
<script src="shared/kick-core.js"></script>
<script src="shared/lang/studio/tr.js"></script>
<script src="shared/lang/studio/en.js"></script>
<script src="shared/lang/studio/es.js"></script>
<script src="shared/lang/studio/pt.js"></script>
<script src="shared/lang/studio/de.js"></script>
<script src="shared/lang/studio/ar.js"></script>
<link rel="stylesheet" href="shared/studio.css">
</head>
<body>
<a class="st-skip" href="#main" data-i18n="skip"></a>

<header>
<div class="st-top">
  <div class="st-brand">
    <span class="st-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></span>
    <div>
      <h1 data-i18n="brand.title"></h1>
      <p class="st-lead" data-i18n="brand.lead"></p>
    </div>
  </div>
  <div class="st-langs" role="group" data-i18n-aria="lang.aria">
    <button type="button" data-lang="tr" lang="tr" aria-label="Türkçe" aria-pressed="false">TR</button>
    <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
    <button type="button" data-lang="es" lang="es" aria-label="Español" aria-pressed="false">ES</button>
    <button type="button" data-lang="pt" lang="pt-BR" aria-label="Português (Brasil)" aria-pressed="false">PT</button>
    <button type="button" data-lang="de" lang="de" aria-label="Deutsch" aria-pressed="false">DE</button>
    <button type="button" data-lang="ar" lang="ar" aria-label="العربية" aria-pressed="false">AR</button>
  </div>
</div>

<p class="st-warnline st-warnbox" id="guncelleme" role="status" hidden><span id="guncelleme-metin"></span> <a id="guncelleme-link" href="https://github.com/IACBI/kick-streamer-overlays/releases/latest" target="_blank" rel="noopener noreferrer" data-i18n="update.link"></a></p>

<ol class="st-how" data-i18n-aria="how.aria">
  <li><b>1</b><span data-i18n="how.1"></span></li>
  <li><b>2</b><span data-i18n="how.2"></span></li>
  <li><b>3</b><span data-i18n="how.3"></span></li>
</ol>
</header>

<!-- Without JavaScript the text table is not available, so both languages are written out. -->
<noscript><p class="st-foot"><span lang="en">This studio needs JavaScript.</span> <span lang="tr">Bu stüdyo JavaScript gerektirir.</span></p></noscript>

<!-- Server mode: the relay runs on a public address and never sends its key, so the owner enters it once. -->
<section class="st-keygate" id="anahtarKutu" aria-labelledby="anahtar-baslik" hidden>
  <h2 id="anahtar-baslik" data-i18n="key.title"></h2>
  <p class="st-note" data-i18n="key.intro"></p>
  <form id="anahtarForm" class="st-look" autocomplete="off">
    <label class="st-sr" for="anahtarGir" data-i18n="key.label"></label>
    <input id="anahtarGir" type="password" spellcheck="false" autocomplete="current-password" data-i18n-ph="key.label">
    <button type="submit" class="st-btn st-btn--primary" data-i18n="key.enter"></button>
  </form>
  <p class="st-status" id="anahtar-durum" role="status" aria-live="polite"></p>
</section>

<main id="main" class="st-layout">

  <!-- Left column: settings -->
  <div class="st-col">

    <form id="ayar-form" class="st-form" autocomplete="off" novalidate>

      <!-- 1. Channel -->
      <section class="st-section" aria-labelledby="s1">
        <h2 id="s1"><span class="st-num">1</span><span data-i18n="s1.title"></span></h2>
        <div class="st-field">
          <label class="st-label" for="kanal" data-i18n="f.kanal"></label>
          <input id="kanal" name="kanal" type="text" maxlength="40" placeholder="ornek_kanal" autocapitalize="none" spellcheck="false" />
          <p class="st-hint" data-i18n="h.kanal"></p>
        </div>
      </section>

      <!-- 2. Look -->
      <section class="st-section" aria-labelledby="s2">
        <h2 id="s2"><span class="st-num">2</span><span data-i18n="s2.title"></span></h2>

        <div class="st-field" style="margin-bottom:18px">
          <span class="st-label" id="presets-label" data-i18n="presets.label"></span>
          <div class="st-presets" id="presets" role="group" aria-labelledby="presets-label"></div>
          <p class="st-hint" data-i18n="presets.hint"></p>
          <div class="st-look">
            <button type="button" class="st-btn st-btn--small" id="lookCopy" data-i18n="look.copy"></button>
            <label class="st-sr" for="lookInput" data-i18n="look.inputLabel"></label>
            <input id="lookInput" type="text" inputmode="url" autocomplete="off" spellcheck="false" data-i18n-ph="look.placeholder">
            <button type="button" class="st-btn st-btn--small" id="lookApply" data-i18n="look.apply"></button>
          </div>
          <p class="st-status" id="lookStatus" role="status" aria-live="polite"></p>
        </div>

        <fieldset class="st-themes-box">
          <legend data-i18n="f.stil"></legend>
          <div id="stil-secenekleri" class="st-themes"></div>
        </fieldset>

        <div class="st-grid">
          <fieldset>
            <legend data-i18n="f.sekil"></legend>
            <div id="sekil-secenekleri" class="st-seg-group"></div>
          </fieldset>
          <fieldset>
            <legend data-i18n="f.dil"></legend>
            <div id="dil-secenekleri" class="st-seg-group"></div>
          </fieldset>
          <fieldset>
            <legend data-i18n="f.animasyon"></legend>
            <div id="animasyon-secenekleri" class="st-seg-group"></div>
          </fieldset>
          <div class="st-field">
            <label class="st-label" for="yaziTipi" data-i18n="f.yaziTipi"></label>
            <select id="yaziTipi" name="yaziTipi"></select>
          </div>
        </div>

        <div class="st-field">
          <span class="st-label" id="renk-label" data-i18n="f.renk"></span>
          <div class="st-color-row">
            <input id="renk" name="renk" type="color" value="#53fc18" aria-labelledby="renk-label" />
            <input id="renkMetin" type="text" maxlength="7" spellcheck="false" data-i18n-aria="f.renkHex" placeholder="#53fc18" />
          </div>
          <p class="st-warnline" id="renk-uyari" role="status" hidden></p>
        </div>

        <div class="st-checks">
          <label class="st-check"><input type="checkbox" name="yuzdeGoster" /> <span data-i18n="f.yuzdeGoster"></span></label>
          <label class="st-check"><input type="checkbox" name="oturumFarkiGoster" /> <span data-i18n="f.oturumFarkiGoster"></span></label>
          <label class="st-check"><input type="checkbox" name="hataNotu" /> <span data-i18n="f.hataNotu"></span></label>
          <label class="st-check"><input type="checkbox" name="bilgiBaslik" /> <span data-i18n="f.bilgiBaslik"></span></label>
        </div>

        <div class="st-actions">
          <button type="button" class="st-btn st-btn--ghost st-btn--small" id="sifirla" data-i18n="reset"></button>
        </div>
        <div class="st-confirm" id="sifirla-onay" role="alertdialog" aria-labelledby="sifirla-soru" hidden>
          <p id="sifirla-soru" data-i18n="reset.confirm"></p>
          <button type="button" class="st-btn st-btn--small" id="sifirlaEvet" data-i18n="reset.yes"></button>
          <button type="button" class="st-btn st-btn--small st-btn--ghost" id="sifirlaIptal" data-i18n="reset.no"></button>
        </div>
      </section>

      <!-- 3. Numbers and content -->
      <section class="st-section" aria-labelledby="s3">
        <h2 id="s3"><span class="st-num">3</span><span data-i18n="s3.title"></span><span class="st-tag" data-i18n="tag.optional"></span></h2>
        <p class="st-intro" data-i18n="s3.intro"></p>

        <details class="st-group" id="g-goals" open>
          <summary><span data-i18n="g.goals"></span><small data-i18n="g.goals.for"></small></summary>
          <div class="st-group-body st-grid">
            <div class="st-field">
              <label class="st-label" for="takipciHedefi" data-i18n="f.takipciHedefi"></label>
              <input id="takipciHedefi" name="takipciHedefi" type="number" min="1" max="100000000" step="1" inputmode="numeric" />
            </div>
            <div class="st-field">
              <label class="st-label" for="takipciYedek" data-i18n="f.takipciYedek"></label>
              <input id="takipciYedek" name="takipciYedek" type="number" min="0" max="100000000" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.takipciYedek"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="aboneHedefi" data-i18n="f.aboneHedefi"></label>
              <input id="aboneHedefi" name="aboneHedefi" type="number" min="1" max="100000000" step="1" inputmode="numeric" />
            </div>
            <div class="st-field">
              <label class="st-label" for="aboneSayisi" data-i18n="f.aboneSayisi"></label>
              <input id="aboneSayisi" name="aboneSayisi" type="number" min="0" max="100000000" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.aboneSayisi"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="yenilemeSn" data-i18n="f.yenilemeSn"></label>
              <input id="yenilemeSn" name="yenilemeSn" type="number" min="10" max="600" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.yenilemeSn"></p>
            </div>
            <div class="st-field st-wide">
              <label class="st-check"><input type="checkbox" name="hedefKutlama" /> <span data-i18n="f.hedefKutlama"></span></label>
              <p class="st-hint" data-i18n="h.hedefKutlama"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="hedefArtis" data-i18n="f.hedefArtis"></label>
              <input id="hedefArtis" name="hedefArtis" type="number" min="0" max="100000000" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.hedefArtis"></p>
            </div>
          </div>
        </details>

        <details class="st-group" id="g-chat">
          <summary><span data-i18n="g.chat"></span></summary>
          <div class="st-group-body st-grid">
            <div class="st-field">
              <label class="st-label" for="sohbetMaksMesaj" data-i18n="f.sohbetMaksMesaj"></label>
              <input id="sohbetMaksMesaj" name="sohbetMaksMesaj" type="number" min="3" max="20" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.sohbetMaksMesaj"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="yayinciYazisi" data-i18n="f.yayinciYazisi"></label>
              <input id="yayinciYazisi" name="yayinciYazisi" type="text" maxlength="24" />
              <p class="st-hint" data-i18n="h.yayinciYazisi"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="sohbetSilinmeSn" data-i18n="f.sohbetSilinmeSn"></label>
              <input id="sohbetSilinmeSn" name="sohbetSilinmeSn" type="number" min="0" max="600" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.sohbetSilinmeSn"></p>
            </div>
            <div class="st-field st-wide">
              <label class="st-label" for="sohbetGizliKullanicilar" data-i18n="f.sohbetGizliKullanicilar"></label>
              <input id="sohbetGizliKullanicilar" name="sohbetGizliKullanicilar" type="text" maxlength="300" spellcheck="false" autocapitalize="none" data-i18n-ph="ph.sohbetGizliKullanicilar" />
              <p class="st-hint" data-i18n="h.sohbetGizliKullanicilar"></p>
            </div>
            <div class="st-field st-wide">
              <label class="st-check"><input type="checkbox" name="sohbetKomutGizle" /> <span data-i18n="f.sohbetKomutGizle"></span></label>
              <p class="st-hint" data-i18n="h.sohbetKomutGizle"></p>
            </div>
            <div class="st-field st-wide">
              <label class="st-check"><input type="checkbox" name="sohbetYatay" /> <span data-i18n="f.sohbetYatay"></span></label>
              <p class="st-hint" data-i18n="h.sohbetYatay"></p>
            </div>
          </div>
        </details>

        <details class="st-group" id="g-alerts">
          <summary><span data-i18n="g.alerts"></span></summary>
          <div class="st-group-body st-grid">
            <div class="st-field">
              <label class="st-label" for="uyariSn" data-i18n="f.uyariSn"></label>
              <input id="uyariSn" name="uyariSn" type="number" min="3" max="30" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.uyariSn"></p>
            </div>
            <fieldset class="st-field st-wide st-fieldset">
              <legend class="st-label" data-i18n="f.uyariTurler"></legend>
              <div class="st-checks">
                <label class="st-check"><input type="checkbox" name="uyariTakip" /> <span data-i18n="f.uyariTakip"></span></label>
                <label class="st-check"><input type="checkbox" name="uyariAbone" /> <span data-i18n="f.uyariAbone"></span></label>
                <label class="st-check"><input type="checkbox" name="uyariHediye" /> <span data-i18n="f.uyariHediye"></span></label>
                <label class="st-check"><input type="checkbox" name="uyariKicks" /> <span data-i18n="f.uyariKicks"></span></label>
                <label class="st-check"><input type="checkbox" name="uyariOdul" /> <span data-i18n="f.uyariOdul"></span></label>
              </div>
              <p class="st-hint" data-i18n="h.uyariTurler"></p>
            </fieldset>
            <div class="st-field">
              <label class="st-check"><input type="checkbox" name="uyariSes" /> <span data-i18n="f.uyariSes"></span></label>
              <p class="st-hint" data-i18n="h.uyariSes"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="uyariSesSeviye" data-i18n="f.uyariSesSeviye"></label>
              <input id="uyariSesSeviye" name="uyariSesSeviye" type="number" min="0" max="100" step="5" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.uyariSesSeviye"></p>
            </div>
            <div class="st-field st-wide">
              <label class="st-label" for="uyariOdulGizle" data-i18n="f.uyariOdulGizle"></label>
              <input id="uyariOdulGizle" name="uyariOdulGizle" type="text" maxlength="400" data-i18n-ph="ph.uyariOdulGizle" />
              <p class="st-hint" data-i18n="h.uyariOdulGizle"></p>
            </div>
            <div class="st-field">
              <label class="st-check"><input type="checkbox" name="uyariTts" /> <span data-i18n="f.uyariTts"></span></label>
              <p class="st-hint" data-i18n="h.uyariTts"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="uyariTtsUzunluk" data-i18n="f.uyariTtsUzunluk"></label>
              <input id="uyariTtsUzunluk" name="uyariTtsUzunluk" type="number" min="20" max="200" step="10" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.uyariTtsUzunluk"></p>
            </div>
            <div class="st-field st-wide">
              <label class="st-label" for="uyariTtsYasak" data-i18n="f.uyariTtsYasak"></label>
              <input id="uyariTtsYasak" name="uyariTtsYasak" type="text" maxlength="400" data-i18n-ph="ph.uyariTtsYasak" />
              <p class="st-hint" data-i18n="h.uyariTtsYasak"></p>
            </div>
            <div class="st-field st-wide">
              <span class="st-label" data-i18n="f.uyariTest"></span>
              <div class="st-actions" style="margin-top:0">
                <button type="button" class="st-btn st-btn--small" id="sesDene" data-i18n="test.sound"></button>
                <button type="button" class="st-btn st-btn--small" data-test-alert="follow" data-i18n="f.uyariTakip"></button>
                <button type="button" class="st-btn st-btn--small" data-test-alert="sub" data-i18n="f.uyariAbone"></button>
                <button type="button" class="st-btn st-btn--small" data-test-alert="gift" data-i18n="f.uyariHediye"></button>
                <button type="button" class="st-btn st-btn--small" data-test-alert="kicks" data-i18n="f.uyariKicks"></button>
                <button type="button" class="st-btn st-btn--small" data-test-alert="reward" data-i18n="f.uyariOdul"></button>
              </div>
              <p id="test-durum" class="st-status" role="status" style="margin-top:0"></p>
              <p class="st-hint" data-i18n="h.uyariTest"></p>
            </div>
          </div>
        </details>

        <details class="st-group" id="g-stats">
          <summary><span data-i18n="g.stats"></span></summary>
          <div class="st-group-body st-grid">
            <div class="st-field">
              <label class="st-label" for="olaySayisi" data-i18n="f.olaySayisi"></label>
              <input id="olaySayisi" name="olaySayisi" type="number" min="3" max="10" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.olaySayisi"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="liderTur" data-i18n="f.liderTur"></label>
              <select id="liderTur" name="liderTur">
                <option value="gift" data-i18n="o.liderTur.gift"></option>
                <option value="kicks" data-i18n="o.liderTur.kicks"></option>
              </select>
              <p class="st-hint" data-i18n="h.liderTur"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="liderSayisi" data-i18n="f.liderSayisi"></label>
              <input id="liderSayisi" name="liderSayisi" type="number" min="3" max="10" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.liderSayisi"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="kicksHedefi" data-i18n="f.kicksHedefi"></label>
              <input id="kicksHedefi" name="kicksHedefi" type="number" min="1" max="100000000" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.kicksHedefi"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="trenSn" data-i18n="f.trenSn"></label>
              <input id="trenSn" name="trenSn" type="number" min="30" max="600" step="10" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.trenSn"></p>
            </div>
            <div class="st-field st-wide">
              <p class="st-hint" data-i18n="h.stats"></p>
            </div>
          </div>
        </details>

        <details class="st-group" id="g-countdown">
          <summary><span data-i18n="g.countdown"></span></summary>
          <div class="st-group-body st-grid">
            <div class="st-field">
              <label class="st-label" for="geriSayimDk" data-i18n="f.geriSayimDk"></label>
              <input id="geriSayimDk" name="geriSayimDk" type="number" min="1" max="720" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.geriSayimDk"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="geriSayimSaat" data-i18n="f.geriSayimSaat"></label>
              <input id="geriSayimSaat" name="geriSayimSaat" type="text" maxlength="5" inputmode="numeric" spellcheck="false" placeholder="21:30" />
              <p class="st-hint" data-i18n="h.geriSayimSaat"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="geriSayimBaslik" data-i18n="f.geriSayimBaslik"></label>
              <input id="geriSayimBaslik" name="geriSayimBaslik" type="text" maxlength="60" />
              <p class="st-hint" data-i18n="h.geriSayimBaslik"></p>
            </div>
          </div>
        </details>

        <details class="st-group" id="g-ticker">
          <summary><span data-i18n="g.ticker"></span></summary>
          <div class="st-group-body st-grid">
            <div class="st-field st-wide">
              <label class="st-label" for="duyuruMetinleri" data-i18n="f.duyuruMetinleri"></label>
              <input id="duyuruMetinleri" name="duyuruMetinleri" type="text" maxlength="400" data-i18n-ph="ph.duyuruMetinleri" />
              <p class="st-hint" data-i18n="h.duyuruMetinleri"></p>
            </div>
            <div class="st-field">
              <label class="st-label" for="duyuruSn" data-i18n="f.duyuruSn"></label>
              <input id="duyuruSn" name="duyuruSn" type="number" min="3" max="60" step="1" inputmode="numeric" />
              <p class="st-hint" data-i18n="h.duyuruSn"></p>
            </div>
          </div>
        </details>

        <details class="st-group" id="g-css">
          <summary><span data-i18n="g.css"></span></summary>
          <div class="st-group-body st-grid">
            <div class="st-field st-wide">
              <label class="st-label" for="ozelCss" data-i18n="f.ozelCss"></label>
              <textarea id="ozelCss" name="ozelCss" rows="5" maxlength="2000" spellcheck="false" autocapitalize="none" placeholder=".ko-label { letter-spacing: 2px; }"></textarea>
              <p class="st-warnline" id="css-uyari" role="status" hidden></p>
              <p class="st-hint" data-i18n="h.ozelCss"></p>
            </div>
          </div>
        </details>

        <details class="st-group" id="g-relay">
          <summary><span data-i18n="g.relay"></span><small data-i18n="g.relay.for"></small></summary>
          <div class="st-group-body st-grid">
            <div class="st-field st-wide">
              <label class="st-label" for="relayAdresi" data-i18n="f.relayAdresi"></label>
              <input id="relayAdresi" name="relayAdresi" type="text" maxlength="200" spellcheck="false" autocapitalize="none" placeholder="http://127.0.0.1:8790" />
              <p class="st-hint" data-i18n="h.relayAdresi"></p>
            </div>
            <div class="st-field st-wide">
              <div class="st-actions" style="margin-top:0">
                <button type="button" class="st-btn st-btn--small" id="relayKontrol" data-i18n="relay.check"></button>
              </div>
              <p id="relay-durum" class="st-status" role="status" style="margin-top:0"></p>
              <ul id="relay-tani" class="st-list st-diag" hidden></ul>
            </div>
          </div>
        </details>
      </section>

    </form>

    <!-- 4. Add to OBS -->
    <section class="st-section" aria-labelledby="s4">
      <h2 id="s4"><span class="st-num">4</span><span data-i18n="s4.title"></span></h2>
      <ol class="st-steps">
        <li data-i18n="s4.step1"></li>
        <li data-i18n="s4.step2"></li>
        <li data-i18n="s4.step3"></li>
      </ol>
      <div class="st-savebar" id="kaydetKutu" hidden>
        <p class="st-note" data-i18n="save.hint"></p>
        <div class="st-actions" style="margin-top:0">
          <button type="button" id="relayKaydet" class="st-btn st-btn--primary" data-i18n="save.button"></button>
        </div>
        <p id="kaydet-durum" class="st-status" role="status"></p>
        <p class="st-note" id="anahtarNot" hidden><span data-i18n="key.note"></span> <button type="button" class="st-linkbtn" id="anahtarUnut" data-i18n="key.forget"></button></p>
      </div>
      <p class="st-warnline st-warnbox" id="kanal-uyari" role="status" hidden><span data-i18n="links.needChannel"></span> <button type="button" class="st-linkbtn" id="kanalaGit" data-i18n="links.goChannel"></button></p>
      <div id="kartlar" class="st-cards"></div>
      <div class="st-actions">
        <button type="button" id="hepsiniKopyala" class="st-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          <span data-i18n="links.copyAll"></span>
        </button>
        <button type="button" id="obsIndir" class="st-btn st-btn--primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          <span data-i18n="obs.download"></span>
        </button>
      </div>
      <p class="st-note" data-i18n="obs.how"></p>
      <div class="st-actions">
        <button type="button" id="dockKopyala" class="st-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          <span data-i18n="dock.copy"></span>
        </button>
      </div>
      <p class="st-note" data-i18n="dock.how"></p>
      <p class="st-note" id="s4-again" data-i18n="s4.again"></p>

      <details class="st-group" style="margin-top:16px">
        <summary><span data-i18n="file.title"></span><small data-i18n="file.sub"></small></summary>
        <div class="st-group-body">
          <p class="st-hint" style="margin-bottom:12px" data-i18n="file.intro"></p>
          <textarea id="cikti" readonly spellcheck="false" data-i18n-aria="file.aria"></textarea>
          <div class="st-actions">
            <button type="button" id="indir" class="st-btn st-btn--primary" data-i18n="file.download"></button>
            <button type="button" id="kopyala" class="st-btn"><span data-i18n="file.copy"></span></button>
          </div>
          <p id="cikti-durum" class="st-status" role="status"></p>
        </div>
      </details>

      <details class="st-group" style="margin-top:10px">
        <summary><span data-i18n="backup.title"></span><small data-i18n="backup.sub"></small></summary>
        <div class="st-group-body">
          <p class="st-hint" style="margin-bottom:12px" data-i18n="backup.intro"></p>
          <div class="st-actions" style="margin-top:0">
            <button type="button" id="disaAktar" class="st-btn" data-i18n="backup.export"></button>
            <button type="button" id="iceAktar" class="st-btn" data-i18n="backup.import"></button>
            <input type="file" id="iceAktarDosya" class="st-sr" accept=".json,application/json" tabindex="-1" data-i18n-aria="backup.import" />
          </div>
          <p id="yedek-durum" class="st-status" role="status"></p>
        </div>
      </details>
    </section>

    <!-- 5. Kick app (optional). Outside the form: secrets never reach the output. -->
    <section class="st-section" aria-labelledby="s5">
      <h2 id="s5"><span class="st-num">5</span><span data-i18n="s5.title"></span><span class="st-tag" data-i18n="tag.optional"></span></h2>
      <p class="st-intro" data-i18n="s5.intro"></p>

      <div class="st-grid">
        <div class="st-field">
          <label class="st-label" for="kickClientId">Client ID</label>
          <input id="kickClientId" type="password" autocomplete="off" spellcheck="false" />
        </div>
        <div class="st-field">
          <label class="st-label" for="kickClientSecret">Client Secret</label>
          <input id="kickClientSecret" type="password" autocomplete="new-password" spellcheck="false" />
        </div>
      </div>
      <div class="st-checks">
        <label class="st-check"><input id="gizliGoster" type="checkbox" /> <span data-i18n="s5.show"></span></label>
      </div>
      <div class="st-actions">
        <button type="button" id="kickTest" class="st-btn" data-i18n="s5.test"></button>
        <button type="button" id="yerelIndir" class="st-btn" data-i18n="s5.download"></button>
        <button type="button" id="olayBagla" class="st-btn st-btn--primary" data-i18n="s5.connect" hidden></button>
      </div>
      <p id="kick-durum" class="st-status" role="status"></p>
      <div id="kurulum" class="st-checklist" hidden>
        <h3 class="st-label" data-i18n="chk.title"></h3>
        <ul id="kurulum-liste" class="st-list st-diag" aria-live="polite"></ul>
      </div>
      <p class="st-hint" data-i18n="s5.hint"></p>
    </section>

    <!-- 6. Help -->
    <section class="st-section" aria-labelledby="s6">
      <h2 id="s6"><span class="st-num">6</span><span data-i18n="s6.title"></span></h2>
      <details class="st-group">
        <summary><span data-i18n="help.check.title"></span></summary>
        <div class="st-group-body"><ul class="st-list" id="yardim-liste"></ul></div>
      </details>
      <details class="st-group">
        <summary><span data-i18n="help.notes.title"></span></summary>
        <div class="st-group-body"><dl class="st-notes" id="yardim-notlar"></dl></div>
      </details>
    </section>

  </div>

  <!-- Right column: sticky preview -->
  <aside class="st-col st-preview" aria-labelledby="pv-title">
    <section class="st-section">
      <h2 id="pv-title" class="st-h" data-i18n="pv.title"></h2>
      <div class="st-tabs" id="sekmeler" role="tablist" data-i18n-aria="pv.tabs"></div>
      <!-- The panel takes the tab stop (tabs pattern); the frame is a picture with nothing to operate inside. -->
      <div class="st-stage" id="sahne" data-bg="checker" role="tabpanel" tabindex="0" aria-live="off">
        <div class="st-fit" id="sigdir"><iframe id="onizleme" width="520" height="90" tabindex="-1"></iframe></div>
      </div>
      <div class="st-pv-meta">
        <span class="st-chip" id="pv-boyut"></span>
        <span class="st-chip" id="pv-veri"></span>
        <button type="button" class="st-btn st-btn--small" id="pv-canli" aria-pressed="false" data-i18n="pv.live"></button>
        <span class="st-grow"></span>
        <a class="st-btn st-btn--small st-btn--ghost" id="pv-ac" target="_blank" rel="noopener" data-i18n="pv.open"></a>
      </div>
      <div class="st-pv-meta">
        <span id="bg-label" data-i18n="pv.bg"></span>
        <span class="st-bgs" id="arkaplanlar" role="group" aria-labelledby="bg-label"></span>
      </div>
    </section>
  </aside>
</main>

<footer class="st-foot">
  <span data-i18n="foot.notAffiliated"></span>
  <span>© 2026 𝓐.𝓒.𝓑</span>

</footer>

<div class="st-toast" id="toast" role="status" aria-live="polite"></div>
<div class="st-sr" id="sr-canli" role="status" aria-live="polite"></div>

<script src="shared/studio.js"></script>
</body>
</html>

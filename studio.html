<!DOCTYPE html>
<html lang="tr">
<head>
<!-- Kick Overlay Studio: choose a look, preview it, copy a link for each overlay and paste it into OBS.
     Preview sizes match OBS: follower-bar 520x90, subscriber-bar 520x90, combined-bar 520x180,
     info-panel 300x80, countdown 520x190, ticker 760x80, chat 460x760. -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Overlay Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.relay.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  /* ---- Studio tokens (UI only; overlay styling lives in shared/themes.css) ---- */
  :root {
    color-scheme: dark light;
    --st-bg: #0b0d12;
    --st-glow: rgb(83 252 24 / 7%);
    --st-panel: #12151d;
    --st-raised: #0f1219;
    --st-field: #0a0c11;
    --st-line: #242a38;
    --st-line-strong: #66738f; /* control borders: at least 3:1 against field, panel and raised surfaces */
    --st-text: #e7eaf2;
    --st-muted: #98a2b8;
    --st-focus: #7aa7ff;
    --st-sel-bg: #151c2c;
    --st-primary: #53fc18;
    --st-primary-hover: #7bff4d;
    --st-on-primary: #07130a;
    --st-ok: #4ade80;
    --st-err: #f87171;
    --st-warn: #fbbf24;
    --st-shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 22%);
    --st-accent: #53fc18;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --st-bg: #f3f5fa;
      --st-glow: rgb(35 128 10 / 8%);
      --st-panel: #ffffff;
      --st-raised: #f6f7fb;
      --st-field: #ffffff;
      --st-line: #d9deea;
      --st-line-strong: #7a859c;
      --st-text: #151a26;
      --st-muted: #566079;
      --st-focus: #2f5fd0;
      --st-sel-bg: #eaf1ff;
      --st-primary: #23800a;
      --st-primary-hover: #1c6a08;
      --st-on-primary: #ffffff;
      --st-ok: #15803d;
      --st-err: #b91c1c;
      --st-warn: #92400e;
      --st-shadow: 0 1px 2px rgb(20 30 60 / 8%), 0 8px 24px rgb(20 30 60 / 8%);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    background: radial-gradient(900px 420px at 15% -80px, var(--st-glow), transparent 70%), var(--st-bg);
    color: var(--st-text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overflow-wrap: anywhere;
  }

  :focus-visible { outline: 2px solid var(--st-focus); outline-offset: 2px; }

  h1, h2, h3 { margin: 0; line-height: 1.3; }
  p { margin: 0; }
  a { color: var(--st-focus); }

  .st-skip {
    position: absolute; left: 12px; top: -48px; z-index: 50; padding: 8px 14px; border-radius: 10px;
    background: var(--st-primary); color: var(--st-on-primary); font-weight: 700; text-decoration: none;
  }
  .st-skip:focus { top: 12px; }
  .st-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

  /* ---- Top bar ---- */
  .st-top {
    max-width: 1280px; margin: 0 auto; padding: 20px 20px 0;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .st-brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 320px; }
  .st-mark {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, #53fc18, #1fa400); color: #07130a; box-shadow: 0 6px 18px rgb(83 252 24 / 28%);
  }
  .st-mark svg { width: 22px; height: 22px; }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.015em; }
  .st-lead { color: var(--st-muted); font-size: 14px; }

  .st-langs { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--st-line-strong); border-radius: 999px; background: var(--st-panel); }
  .st-langs button {
    min-width: 44px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent;
    color: var(--st-muted); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .st-langs button[aria-pressed="true"] { background: var(--st-primary); color: var(--st-on-primary); }

  /* ---- How it works strip ---- */
  .st-how {
    max-width: 1280px; margin: 18px auto 0; padding: 0 20px; display: grid; gap: 10px;
    grid-template-columns: repeat(3, minmax(0, 1fr)); list-style: none;
  }
  .st-how li {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--st-line);
    border-radius: 12px; background: var(--st-panel); font-size: 14px; font-weight: 600;
  }
  .st-how b {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; background: var(--st-primary); color: var(--st-on-primary);
  }

  /* ---- Layout ---- */
  .st-layout {
    max-width: 1280px; margin: 18px auto 0; padding: 0 20px 56px;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start;
  }
  .st-col { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .st-form { display: flex; flex-direction: column; gap: 16px; margin: 0; min-width: 0; }

  @media (min-width: 1000px) {
    .st-layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
    .st-preview { position: sticky; top: 16px; }
  }

  /* ---- Cards ---- */
  .st-section {
    background: var(--st-panel); border: 1px solid var(--st-line); border-radius: 16px;
    padding: 20px; min-width: 0; box-shadow: var(--st-shadow);
  }
  .st-section > h2, .st-section > .st-h { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .st-num {
    display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
    font-size: 12px; font-weight: 800; background: var(--st-line); color: var(--st-text);
  }
  .st-intro { color: var(--st-muted); font-size: 14px; margin: -4px 0 14px; }
  .st-tag { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--st-muted); border: 1px solid var(--st-line); border-radius: 999px; padding: 1px 9px; }

  /* Collapsible groups (native details) */
  details.st-group { border: 1px solid var(--st-line); border-radius: 12px; background: var(--st-raised); }
  details.st-group + details.st-group { margin-top: 10px; }
  details.st-group > summary {
    list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
    font-weight: 700; font-size: 14px; border-radius: 12px; user-select: none;
  }
  details.st-group > summary::-webkit-details-marker { display: none; }
  details.st-group > summary::after {
    content: ''; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--st-muted); border-bottom: 2px solid var(--st-muted);
    transform: rotate(45deg); transition: transform .15s; flex: 0 0 auto;
  }
  details.st-group[open] > summary::after { transform: rotate(-135deg); }
  details.st-group > summary small { font-weight: 500; color: var(--st-muted); font-size: 13px; }
  .st-group-body { padding: 4px 14px 16px; }
  .st-section > details.st-group:only-child { margin: 0; }

  /* ---- Fields ---- */
  .st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 16px; }
  .st-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .st-field + .st-field { margin-top: 14px; }
  .st-grid > .st-field { margin-top: 0; }
  .st-wide { grid-column: 1 / -1; }
  .st-label { font-size: 14px; font-weight: 600; }
  .st-hint { font-size: 13px; color: var(--st-muted); }

  input[type="text"], input[type="number"], input[type="password"], select, textarea {
    width: 100%; min-height: 42px; padding: 8px 12px; font: inherit; color: var(--st-text);
    background: var(--st-field); border: 1px solid var(--st-line-strong); border-radius: 10px;
    transition: border-color .15s;
  }
  input:hover, select:hover, textarea:hover { border-color: var(--st-muted); }
  input[type="number"] { font-variant-numeric: tabular-nums; }
  select { appearance: auto; }
  input::placeholder { color: var(--st-muted); opacity: .7; }
  input[type="color"] {
    width: 48px; height: 42px; padding: 3px; background: var(--st-field); border: 1px solid var(--st-line-strong);
    border-radius: 10px; cursor: pointer; flex: 0 0 auto;
  }
  textarea { min-height: 300px; resize: vertical; font-family: 'Roboto Mono', ui-monospace, Consolas, monospace; font-size: 12.5px; line-height: 1.55; white-space: pre; overflow: auto; }
  .st-color-row { display: flex; gap: 10px; align-items: center; }
  .st-color-row input[type="text"] { max-width: 160px; }

  fieldset { min-width: 0; margin: 0 0 16px; padding: 0; border: 0; }
  legend { padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
  .st-checks { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .st-check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
  .st-check input { width: 18px; height: 18px; accent-color: var(--st-primary); margin: 0; }

  /* ---- Choice cards and segmented options (native radios, visually hidden) ---- */
  .st-themes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .st-themes > .st-opt { min-width: 0; }
  .st-seg-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .st-opt {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px;
    padding: 8px 12px; border: 1px solid var(--st-line-strong); border-radius: 10px; background: var(--st-raised);
    cursor: pointer; font-size: 14px; font-weight: 500; transition: border-color .15s, background .15s;
  }
  .st-opt:hover { border-color: var(--st-muted); }
  .st-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
  .st-opt:focus-within { outline: 2px solid var(--st-focus); outline-offset: 2px; }
  .st-opt.is-checked { border-color: var(--st-focus); background: var(--st-sel-bg); box-shadow: inset 0 0 0 1px var(--st-focus); font-weight: 700; }
  .st-theme { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 8px; padding: 10px; }
  .st-theme .st-opt-text { text-align: left; }

  .st-swatch {
    position: relative; display: block; height: 40px; border-radius: 8px; overflow: hidden;
    background: linear-gradient(135deg, #1d2433, #131824); border: 1px solid #2a3142;
  }
  .st-swatch i { position: absolute; left: 10px; right: 38%; top: 50%; height: 12px; margin-top: -6px; border-radius: 999px; background: var(--st-accent); }
  .st-swatch[data-stil="vivid"] { background: color-mix(in srgb, var(--st-accent) 16%, #0c0f15); border-color: var(--st-accent); }
  .st-swatch[data-stil="soft"] { background: #1c2232; border-color: #2f3750; }
  .st-swatch[data-stil="soft"] i { height: 14px; margin-top: -7px; border-radius: 999px; }
  .st-swatch[data-stil="cinema"] { background: #030405; }
  .st-swatch[data-stil="cinema"] i { box-shadow: 0 2px 6px rgba(0, 0, 0, .8); }
  .st-swatch[data-stil="neon"] { background: #03050a; border-color: var(--st-accent); box-shadow: 0 0 10px color-mix(in srgb, var(--st-accent) 40%, transparent); }
  .st-swatch[data-stil="neon"] i { box-shadow: 0 0 8px var(--st-accent); }
  .st-swatch[data-stil="minimal"] { background: #151922; border-color: transparent; }
  .st-swatch[data-stil="minimal"] i { height: 6px; margin-top: -3px; }
  .st-swatch[data-stil="pastel"] { background: #eceef6; border-color: #ffffff; }
  .st-swatch[data-stil="pastel"] i { background: color-mix(in srgb, var(--st-accent) 60%, #fff); }
  .st-swatch[data-stil="terminal"] { background: #050a07; border: 1px dashed color-mix(in srgb, var(--st-accent) 60%, transparent); }
  .st-swatch[data-stil="terminal"] i { border-radius: 0; background: repeating-linear-gradient(90deg, var(--st-accent) 0 6px, transparent 6px 9px); }
  .st-swatch[data-stil="aurora"] { background: linear-gradient(120deg, #0b1d2e, #1b2a4a 55%, #173b3a); border-color: #2a4a5c; }
  .st-swatch[data-stil="aurora"] i { background: linear-gradient(90deg, #5eead4, #a78bfa); }
  .st-swatch[data-stil="holo"] { background: linear-gradient(120deg, #1a1d2e, #2b1d3d 50%, #1d2e33); border-color: #3a3550; }
  .st-swatch[data-stil="holo"] i { background: linear-gradient(90deg, #ff7ae0, #7ae7ff, #c6ff7a); }
  .st-swatch[data-stil="ember"] { background: #160b06; border-color: #4a2414; }
  .st-swatch[data-stil="ember"] i { background: linear-gradient(90deg, #ff9a1a, #ff3b1a); box-shadow: 0 0 8px rgba(255, 92, 26, .5); }
  .st-swatch[data-stil="paper"] { background: #f4ecdc; border-color: #d9cdb4; }
  .st-swatch[data-stil="paper"] i { background: #b45309; }
  .st-swatch[data-stil="retro"] { background: #0a0a0a; border-color: #2a2a2a; }
  .st-swatch[data-stil="retro"] i { height: 8px; margin-top: -4px; border-radius: 0; background: repeating-linear-gradient(90deg, #ffb000 0 4px, transparent 4px 8px); }

  /* ---- Buttons ---- */
  .st-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .st-btn {
    min-height: 40px; padding: 0 16px; font: inherit; font-size: 14px; font-weight: 600; color: var(--st-text);
    background: var(--st-raised); border: 1px solid var(--st-line-strong); border-radius: 10px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    transition: background .15s, border-color .15s, transform .08s;
  }
  .st-btn:hover:not(:disabled) { border-color: var(--st-muted); background: var(--st-sel-bg); }
  .st-btn:active:not(:disabled) { transform: translateY(1px); }
  .st-btn:disabled { opacity: .5; cursor: not-allowed; }
  .st-btn--primary { background: var(--st-primary); border-color: transparent; color: var(--st-on-primary); }
  .st-btn--primary:hover:not(:disabled) { background: var(--st-primary-hover); border-color: transparent; }
  .st-btn--ghost { background: transparent; }
  .st-btn--small { min-height: 40px; padding: 0 12px; font-size: 13px; }
  .st-btn.is-done { background: var(--st-ok); border-color: transparent; color: #07130a; }
  .st-btn.is-done:hover:not(:disabled) { background: var(--st-ok); }
  .st-btn[aria-pressed="true"] { background: var(--st-sel-bg); border-color: var(--st-focus); box-shadow: inset 0 0 0 1px var(--st-focus); }
  .st-btn svg { width: 16px; height: 16px; flex: 0 0 auto; }

  .st-presets { display: flex; flex-wrap: wrap; gap: 8px; }
  .st-presets .st-btn { gap: 8px; }
  .st-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgb(128 128 128 / 50%); flex: 0 0 auto; }

  .st-status { min-height: 1.5em; font-size: 14px; margin-top: 12px; color: var(--st-muted); }
  .st-status.is-ok { color: var(--st-ok); }
  .st-status.is-err { color: var(--st-err); }

  /* ---- Overlay link cards ---- */
  .st-cards { display: flex; flex-direction: column; gap: 10px; }
  .st-card { border: 1px solid var(--st-line); border-radius: 12px; background: var(--st-raised); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .st-card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .st-card-name { font-weight: 700; font-size: 14.5px; }
  .st-card-size { margin-left: auto; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--st-line); color: var(--st-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .st-card-desc { font-size: 13px; color: var(--st-muted); }
  .st-card-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .st-card-row input { flex: 1 1 100%; min-height: 36px; font-size: 12.5px; font-family: 'Roboto Mono', ui-monospace, Consolas, monospace; text-overflow: ellipsis; }
  .st-card-row .st-btn { white-space: nowrap; }
  .st-card-warn { font-size: 12.5px; color: var(--st-warn); }
  .st-card-warn[hidden] { display: none; }
  .st-confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; padding: 12px 14px; border: 1px solid var(--st-warn); border-radius: 10px; }
  .st-confirm[hidden] { display: none; }
  .st-confirm p { flex: 1 1 220px; font-size: 14px; font-weight: 600; }
  .st-warnline { font-size: 13px; color: var(--st-warn); margin-top: 6px; }
  .st-warnline[hidden] { display: none; }
  .st-pv-meta[hidden], .st-chip[hidden], .st-btn[hidden] { display: none; }
  .st-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }

  .st-steps { margin: 0 0 14px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .st-note { font-size: 13px; color: var(--st-muted); margin-top: 12px; }

  /* ---- Live preview ---- */
  .st-preview { min-width: 0; }
  .st-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; }
  .st-tab {
    flex: 0 0 auto; min-height: 40px; padding: 0 14px; border: 1px solid var(--st-line-strong); border-radius: 999px;
    background: var(--st-raised); color: var(--st-muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .st-tab:hover { border-color: var(--st-muted); color: var(--st-text); }
  .st-tab[aria-selected="true"] { background: var(--st-sel-bg); border-color: var(--st-focus); color: var(--st-text); box-shadow: inset 0 0 0 1px var(--st-focus); }

  .st-stage {
    display: grid; place-items: center; min-height: 170px; padding: 12px; overflow: hidden;
    border: 1px solid var(--st-line); border-radius: 14px;
  }
  .st-stage[data-bg="checker"] { background: repeating-conic-gradient(#1a1e29 0 25%, #11141c 0 50%) 0 0 / 20px 20px; }
  .st-stage[data-bg="dark"] { background: #0b0f17; }
  .st-stage[data-bg="light"] { background: #e8eaf0; }
  .st-stage[data-bg="scene"] {
    background:
      radial-gradient(60% 80% at 15% 20%, rgb(83 252 24 / 22%), transparent 60%),
      radial-gradient(55% 70% at 90% 85%, rgb(124 58 237 / 38%), transparent 60%),
      radial-gradient(40% 60% at 70% 10%, rgb(14 165 233 / 25%), transparent 60%), #0b0f17;
  }
  .st-fit { position: relative; }
  .st-fit iframe {
    position: absolute; left: 0; top: 0; display: block; border: 0; transform-origin: 0 0; background: transparent;
    /* The overlay pages declare no color-scheme. A mismatch with the page would make Chrome paint the frame opaque white.
       Do not add a color-scheme meta tag to this page: it brings the white frame back in dark mode. */
    color-scheme: normal;
  }
  .st-pv-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--st-muted); }
  .st-pv-meta .st-grow { flex: 1 1 auto; }
  .st-chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border: 1px solid var(--st-line); border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .st-bgs { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .st-bgs button {
    min-height: 40px; min-width: 40px; padding: 0 10px; border: 1px solid var(--st-line-strong); border-radius: 8px; background: transparent;
    color: var(--st-muted); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .st-bgs button[aria-pressed="true"] { background: var(--st-sel-bg); color: var(--st-text); border-color: var(--st-focus); }

  /* ---- Help ---- */
  .st-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .st-notes { margin: 0; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
  .st-notes dt { font-weight: 700; }
  .st-notes dd { margin: 2px 0 0; color: var(--st-muted); }
  h3.st-sub { font-size: 14px; font-weight: 700; color: var(--st-muted); margin: 16px 0 8px; }

  /* ---- Toast and footer ---- */
  .st-toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    padding: 10px 18px; border-radius: 999px; background: var(--st-primary); color: var(--st-on-primary); font-weight: 700; font-size: 14px;
    box-shadow: var(--st-shadow); transition: opacity .2s, transform .2s;
  }
  .st-toast.is-on { opacity: 1; transform: translate(-50%, 0); }
  .st-toast.is-err { background: var(--st-err); color: #fff; }

  .st-foot { max-width: 1280px; margin: 0 auto; padding: 0 20px 40px; color: var(--st-muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 16px; }

  var $ = function (id) { return document.getElementById(id); };

    var table = I18N[lang] || I18N.en;

    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(String(vars[k])); });
    return s;

  function say(el, kind, text) {
    el.textContent = text;

  }

  var toastTimer = 0;
  function toast(text, isErr) {
    var el = $('toast');
    el.textContent = text;
    el.className = 'st-toast is-on' + (isErr ? ' is-err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'st-toast' + (isErr ? ' is-err' : ''); }, 2200);
  }

  function hex6(h) {
    var v = String(h || '');
    if (/^#[0-9a-f]{3}$/i.test(v)) {
      return '#' + v.slice(1).split('').map(function (c) { return c + c; }).join('');
    }
    return v;
  }

  function currentSettings() { return K.normalize(readRaw()); }

  // Reads public fields only. Secret inputs live outside the form and are never read here.
  function readRaw() {
    var raw = {};
    K.schemaKeys().forEach(function (key) {
      var el = form.elements.namedItem(key);
      if (!el) return;
      raw[key] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return raw;
  }

  function writeForm(s) {
    K.schemaKeys().forEach(function (key) {
      var el = form.elements.namedItem(key);
      if (!el) return;
      if (el.type === 'checkbox') el.checked = s[key] === true;
      else el.value = key === 'renk' ? hex6(s[key]) : String(s[key]);
    });
    $('renkMetin').value = s.renk;
  }

  // Only what that overlay reads, so edits to other overlays' settings never reload the frame.
  function previewQuery(o, s, sample) {
    var q = new URLSearchParams();
    COMMON.concat(o.keys).forEach(function (key) {
      if (s[key] !== undefined) q.set(key, String(s[key]));
    });
    if (sample) q.set('onizleme', '1');
    return q.toString();
  }

  function relayValue() { return K.normalizeLocal({ relayAdresi: relayEl.value.trim() }).relayAdresi; }

  function overlayById(id) {
    for (var i = 0; i < OVERLAYS.length; i++) if (OVERLAYS[i].id === id) return OVERLAYS[i];
    return OVERLAYS[0];
  }

  // The link for OBS: only the settings that overlay reads, and only those that differ from the defaults.
  function overlayUrl(o, s) {
    var defaults = K.normalize({});
    var q = new URLSearchParams();
    COMMON.concat(o.keys).forEach(function (key) {
      if (s[key] !== defaults[key]) q.set(key, String(s[key]));
    });
    var url = new URL(o.file, window.location.href);
    url.search = q.toString();
    url.hash = '';
    return url.href;
  }

  function labelOf(name, value) {
    var table = LABELS[lang] || LABELS.en;
    return (table[name] && table[name][value]) || value;

  function applyI18n() {

    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    document.querySelectorAll('[data-label-name]').forEach(function (el) {
      el.textContent = labelOf(el.getAttribute('data-label-name'), el.getAttribute('data-label-value'));
    });
    document.querySelectorAll('[data-preset]').forEach(function (b) { b.querySelector('span:last-child').textContent = t('preset.' + b.getAttribute('data-preset')); });
    document.querySelectorAll('[data-tab]').forEach(function (b) { b.textContent = t('ov.' + b.getAttribute('data-tab')); });

  // ---- Choice controls built from the core enums --------------------------

  function addChoice(container, name, value, kind) {
    var lab = document.createElement('label');
    lab.className = 'st-opt' + (kind === 'theme' ? ' st-theme' : '');

    var input = document.createElement('input');
    input.type = 'radio';
    input.name = name;
    input.value = value;
    lab.appendChild(input);

    if (kind === 'theme') {
      var sw = document.createElement('span');
      sw.className = 'st-swatch';
      sw.setAttribute('data-stil', value);
      sw.setAttribute('aria-hidden', 'true');
      sw.appendChild(document.createElement('i'));
      lab.appendChild(sw);
    }

    var text = document.createElement('span');
    text.className = 'st-opt-text';
    text.setAttribute('data-label-name', name);
    text.setAttribute('data-label-value', value);
    lab.appendChild(text);

    container.appendChild(lab);
  }

  function buildChoices() {
    K.enums('stil').forEach(function (v) { addChoice($('stil-secenekleri'), 'stil', v, 'theme'); });
    K.enums('sekil').forEach(function (v) { addChoice($('sekil-secenekleri'), 'sekil', v); });
    K.enums('dil').forEach(function (v) { addChoice($('dil-secenekleri'), 'dil', v); });
    K.enums('animasyon').forEach(function (v) { addChoice($('animasyon-secenekleri'), 'animasyon', v); });

  // ---- Preview tabs and backgrounds ------------------------------------------

  function buildTabs() {
    var box = $('sekmeler');
    OVERLAYS.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'st-tab';
      b.setAttribute('role', 'tab');
      b.setAttribute('data-tab', o.id);
      b.id = 'tab-' + o.id;
      b.addEventListener('click', function () { selectTab(o.id, true); });
      b.addEventListener('keydown', onTabKey);
      box.appendChild(b);
    });
    var bgBox = $('arkaplanlar');
    BACKGROUNDS.forEach(function (id) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-bg', id);
      b.addEventListener('click', function () { setBackground(id); saveUi(); });
      bgBox.appendChild(b);
    });
  }

  function onTabKey(e) {
    var keys = { ArrowRight: 1, ArrowLeft: -1, Home: 'first', End: 'last' };
    if (!(e.key in keys)) return;
    e.preventDefault();
    var i = OVERLAYS.findIndex(function (o) { return o.id === activeId; });
    var n = keys[e.key] === 'first' ? 0 : keys[e.key] === 'last' ? OVERLAYS.length - 1 : (i + keys[e.key] + OVERLAYS.length) % OVERLAYS.length;
    selectTab(OVERLAYS[n].id, true);
    $('tab-' + OVERLAYS[n].id).focus();
  }

  function selectTab(id, openGroup) {
    var next = overlayById(id).id;
    if (next !== activeId) live = false;
    activeId = next;
    document.querySelectorAll('[data-tab]').forEach(function (b) {
      var on = b.getAttribute('data-tab') === activeId;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    stage.setAttribute('aria-labelledby', 'tab-' + activeId);
    if (openGroup) {
      var g = $(overlayById(activeId).group);
      if (g && !g.open) g.open = true;
    }
    renderFrame();
    fitPreview();
    saveUi();
  }

  function setBackground(id) {
    background = BACKGROUNDS.indexOf(id) >= 0 ? id : 'checker';
    stage.setAttribute('data-bg', background);
    document.querySelectorAll('#arkaplanlar [data-bg]').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-bg') === background ? 'true' : 'false');
    });

  var frameTimer = 0;
  function scheduleFrame() {
    clearTimeout(frameTimer);
    // Live mode talks to Kick on every load, so wait longer while the user is still typing.
    frameTimer = setTimeout(renderFrame, live ? 800 : DEBOUNCE_MS);
  }

  // Editing always previews sample data (onizleme=1); real data only after the "Live data" click.
  // Public settings only in the URL. The frame is touched only when its URL really changes.
  function renderFrame() {
    var o = overlayById(activeId);
    var s = currentSettings();
    var canLive = o.data === true && !!s.kanal;
    if (!canLive) live = false;
    var url = o.file + '?' + previewQuery(o, s, !live);
    if (frame.getAttribute('src') !== url) frame.setAttribute('src', url);
    frame.setAttribute('width', String(o.w));
    frame.setAttribute('height', String(o.h));
    frame.setAttribute('title', t('ov.' + o.id));
    $('pv-ac').setAttribute('href', url);
    $('pv-boyut').textContent = o.w + ' × ' + o.h;
    var chip = $('pv-veri');
    chip.hidden = !o.data && !o.sampleOnly;
    chip.textContent = live ? t('pv.live') : t('pv.sample');
    var btn = $('pv-canli');
    btn.hidden = o.data !== true;
    btn.setAttribute('aria-pressed', live ? 'true' : 'false');
    btn.setAttribute('aria-disabled', canLive ? 'false' : 'true');
    if (canLive) btn.removeAttribute('title'); else btn.setAttribute('title', t('pv.liveNeed'));
  }

  function toggleLive() {
    var o = overlayById(activeId);
    if (o.data !== true) return;
    if (!currentSettings().kanal) { toast(t('pv.liveNeed'), true); return; }
    live = !live;
    announce(t(live ? 'pv.liveOn' : 'pv.liveOff'));
    clearTimeout(frameTimer);
    renderFrame();
  }

  // Scales the frame to fit the stage in width and height. It keeps its real OBS size inside.
  function fitPreview() {
    var o = overlayById(activeId);
    var availW = stage.clientWidth - 24;
    var compact = window.innerWidth < 1000;
    var maxH = compact ? Math.max(90, window.innerHeight * 0.2) : Math.max(180, window.innerHeight * 0.62);
    var k = Math.min(1, availW > 0 ? availW / o.w : 1, maxH / o.h);
    fit.style.width = Math.round(o.w * k) + 'px';
    fit.style.height = Math.round(o.h * k) + 'px';
    frame.style.transform = 'scale(' + k + ')';
  }

  // ---- OBS link cards ----------------------------------------------------------

  var COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';

  function buildCards() {
    var box = $('kartlar');
    OVERLAYS.forEach(function (o) {
      var card = document.createElement('div');
      card.className = 'st-card';
      card.setAttribute('data-card', o.id);

      var head = document.createElement('div');
      head.className = 'st-card-head';
      var name = document.createElement('span');
      name.className = 'st-card-name';
      var size = document.createElement('span');
      size.className = 'st-card-size';
      size.textContent = o.w + ' × ' + o.h;
      head.appendChild(name);
      head.appendChild(size);

      var desc = document.createElement('p');
      desc.className = 'st-card-desc';

      var row = document.createElement('div');
      row.className = 'st-card-row';
      var input = document.createElement('input');
      input.type = 'text';
      input.readOnly = true;
      input.setAttribute('data-url', o.id);
      input.addEventListener('focus', function () { input.select(); });
      var copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'st-btn st-btn--small st-btn--primary';
      copy.setAttribute('data-copy', o.id);
      copy.innerHTML = COPY_ICON;
      var copyLabel = document.createElement('span');
      copyLabel.setAttribute('data-i18n', 'card.copy');
      copy.appendChild(copyLabel);
      copy.addEventListener('click', function () { copyLink(copy, input); });
      var show = document.createElement('button');
      show.type = 'button';
      show.className = 'st-btn st-btn--small st-btn--ghost';
      show.setAttribute('data-show', o.id);
      show.addEventListener('click', function () {
        selectTab(o.id, true);
        // Below 1000 px the preview is pinned to the top and always visible, and its title is hidden:
        // there is nothing to scroll to, so hand focus to the selected tab instead.
        if (window.innerWidth < 1000) $('tab-' + o.id).focus({ preventScroll: true });
        else document.querySelector('.st-preview').scrollIntoView({ block: 'nearest' });
      });
      row.appendChild(input);
      row.appendChild(copy);
      row.appendChild(show);

      var warn = document.createElement('p');
      warn.className = 'st-card-warn';
      warn.hidden = true;

      card.appendChild(head);
      card.appendChild(desc);
      card.appendChild(row);
      card.appendChild(warn);
      box.appendChild(card);
    });
  }

  function refreshCards(s) {
    OVERLAYS.forEach(function (o) {
      var card = document.querySelector('[data-card="' + o.id + '"]');
      var input = card.querySelector('[data-url]');
      var url = overlayUrl(o, s);
      if (input.value !== url) input.value = url;
      card.querySelector('.st-card-warn').hidden = !(o.needsChannel && !s.kanal);
    });
  }

  var announceTimer = 0;
  function announce(text) {
    var el = $('sr-canli');
    el.textContent = '';
    clearTimeout(announceTimer);
    announceTimer = setTimeout(function () { el.textContent = text; }, 60);
  }

  // The button itself says "Copied" for a moment; no toast needed on success.
  function flashCopied(btn) {
    var label = btn.querySelector('[data-i18n]') || btn;
    clearTimeout(btn._flash);
    btn.classList.add('is-done');
    label.textContent = t('copy.done');
    announce(t('copy.done'));
    btn._flash = setTimeout(function () {
      btn.classList.remove('is-done');
      label.textContent = t(label.getAttribute('data-i18n'));
    }, 1600);
  }

  async function copyLink(btn, input) {
    try {
      await navigator.clipboard.writeText(input.value);
      flashCopied(btn);
    } catch (e) {
      input.focus();
      input.select();
      toast(t('toast.linkFail'), true);
    }
  }

  async function copyAllLinks() {
    var s = currentSettings();
    var text = OVERLAYS.map(function (o) { return t('ov.' + o.id) + ': ' + overlayUrl(o, s); }).join('\n');
    try {
      await navigator.clipboard.writeText(text);
      flashCopied($('hepsiniKopyala'));
    } catch (e) {
      toast(t('toast.linkFail'), true);
    }
  }

  // ---- Help ------------------------------------------------------------------

  function buildHelp() {
    var list = $('yardim-liste');
    list.textContent = '';
    ['help.c1', 'help.c2', 'help.c3', 'help.c4'].forEach(function (k) {
      var li = document.createElement('li');
      li.textContent = t(k);
      list.appendChild(li);
    });
    var dl = $('yardim-notlar');
    dl.textContent = '';
    for (var i = 1; i <= 7; i++) {
      var wrap = document.createElement('div');
      var dt = document.createElement('dt');
      dt.textContent = t('help.n' + i + '.t');
      var dd = document.createElement('dd');
      dd.textContent = t('help.n' + i + '.d');
      wrap.appendChild(dt);
      wrap.appendChild(dd);
      dl.appendChild(wrap);
    }
  }

  // ---- Output file ----------------------------------------------------------

  function buildAyarlar(s) {
    var lines = [
      '/* ============================================================',
      '   KICK OVERLAY PACK — AYARLAR / SETTINGS',
      '   ------------------------------------------------------------',
      '   Edit only the values in this file, save, then right-click the',
      '   source in OBS and choose Refresh.',
      '   Secrets (Kick app credentials) do NOT go here: use AYARLAR.local.js.',
      '   ============================================================ */',
      'window.KICK_OVERLAY_AYARLAR = {',
      ''
    ];

    // Keys the loaded core does not know are left out; relayAdresi only when it differs from the default.
    var doc = ayarDoc().filter(function (item) { return s[item.key] !== undefined; });
    var relay = relayValue();
    var entries = doc.map(function (item) { return { key: item.key, note: item.note, value: s[item.key] }; });
    if (relay !== RELAY_DEFAULT) {
      entries.push({ key: 'relayAdresi', note: 'Chat relay address. Change it only if you run the relay somewhere else.', value: relay });
    }
    entries.forEach(function (item, i) {
      if (item.note) {
        item.note.split('\n').forEach(function (l) { lines.push('  // ' + l); });
      }
      var last = i === entries.length - 1;
      lines.push('  ' + item.key + ': ' + JSON.stringify(item.value) + (last ? '' : ','));
      if (!last) lines.push('');
    });

    lines.push('', '};', '');
    return lines.join('\n');
  }

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  async function copyOutput() {
    try {
      await navigator.clipboard.writeText(out.value);
      say(outStatus, 'ok', t('out.copied'));
      flashCopied($('kopyala'));
    } catch (e) {
      out.focus();
      out.select();
      say(outStatus, 'err', t('out.copyFail'));
    }
  }

  // ---- Kick app (secrets stay in memory) ----------------------------------

  function tokenMessage(r) {
    switch (r.error) {
      case 'no-credentials': return t('e.noCreds');
      case 'http':
        if (r.status === 400 || r.status === 401 || r.status === 403) return t('e.tokenBad', { status: r.status });
        return t('e.tokenHttp', { status: r.status });
      case 'timeout': return t('e.tokenTimeout');
      case 'network': return t('e.tokenNet');
      default: return t('e.tokenOther');
    }
  }

  function channelMessage(r) {
    if (r.status === 401 || r.status === 403) return t('e.chanAuth', { status: r.status });
    if (r.status === 429) return t('e.rate');
    if (r.error === 'empty') return t('e.empty');
    if (r.error === 'timeout') return t('e.chanTimeout');
    if (r.error === 'network') return t('e.chanNet');
    return t('e.chanOther');
  }

  async function testKick() {
    var id = $('kickClientId').value.trim();
    var secret = $('kickClientSecret').value.trim();
    if (!id || !secret) { say(kickStatus, 'err', t('e.noCreds')); return; }
    var s = Object.assign({}, currentSettings(), K.normalizeLocal({ kickClientId: id, kickClientSecret: secret }));
    if (!s.kanal) { say(kickStatus, 'err', t('e.noChannel')); return; }

    kickTestBtn.disabled = true;
    say(kickStatus, '', t('e.checking'));
    try {
      var tok = await K.official.token(s);
      if (!tok.ok) { say(kickStatus, 'err', tokenMessage(tok)); return; }

      var o = await K.official.channel(s, tok.token);
      if (!o.ok) { say(kickStatus, 'err', channelMessage(o)); return; }
      if (o.subs === null) { say(kickStatus, 'err', t('e.noSubs')); return; }

      var live = o.live === true ? t('e.live') : (o.live === false ? t('e.offline') : '');
      say(kickStatus, 'ok', t('e.ok', { n: K.fmt(o.subs), live: live }));
    } catch (e) {
      say(kickStatus, 'err', t('e.unexpected'));
    } finally {
      kickTestBtn.disabled = false;
    }
  }

  function downloadLocal() {
    var id = $('kickClientId').value.trim();
    var secret = $('kickClientSecret').value.trim();
    if (!id || !secret) { say(kickStatus, 'err', t('e.localNeed')); return; }
    var text = [
      '/* ' + t('localFile') + ' */',
      'window.KICK_OVERLAY_YEREL = { kickClientId: ' + JSON.stringify(id) +
        ', kickClientSecret: ' + JSON.stringify(secret) + ' };',
      ''
    ].join('\n');
    download('AYARLAR.local.js', text, 'text/javascript;charset=utf-8');
    say(kickStatus, 'ok', t('e.localDone'));
  }

  // ---- Saved state (public values only, never secrets) ----------------------

  function saveDraft() {
    try {
      var raw = readRaw();
      if (relayValue() !== RELAY_DEFAULT) raw.relayAdresi = relayValue();
      localStorage.setItem(DRAFT_KEY, JSON.stringify(raw));
    } catch (e) { /* storage blocked: optional */ }
  }

  function loadDraft() {
    try {
      var saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      if (saved && typeof saved === 'object') {
        writeForm(K.normalize(saved));
        var r = K.normalizeLocal({ relayAdresi: saved.relayAdresi }).relayAdresi;
        relayEl.value = r === RELAY_DEFAULT ? '' : r;
      }
    } catch (e) { /* storage blocked or corrupt draft: keep defaults */ }
  }

  function saveUi() {
    try { localStorage.setItem(UI_KEY, JSON.stringify({ lang: lang, tab: activeId, bg: background })); } catch (e) { /* optional */ }
  }

  function loadUi() {
    var ui = null;
    try { ui = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); } catch (e) { ui = null; }
    var guess = /^tr\b/i.test((navigator.language || '')) ? 'tr' : 'en';
    lang = ui && (ui.lang === 'tr' || ui.lang === 'en') ? ui.lang : guess;
    if (ui && typeof ui.tab === 'string') activeId = overlayById(ui.tab).id;
    if (ui && typeof ui.bg === 'string') background = BACKGROUNDS.indexOf(ui.bg) >= 0 ? ui.bg : 'checker';
  }

  // ---- Accent contrast ------------------------------------------------------

  // Approximate bar surfaces: pastel and paper are light, every other theme sits on a dark surface.
  var LIGHT_SURFACE = { pastel: '#ffffff', paper: '#fbf6ea' };
  var DARK_SURFACE = '#14171f';

  function luminance(hex) {
    var h = hex6(hex).slice(1);
    var c = [0, 2, 4].map(function (i) {
      var v = parseInt(h.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }

  function contrast(a, b) {
    var x = luminance(a), y = luminance(b);
    return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
  }

  // Dark themes need an accent that stands out (3:1). Light themes tint the fill with the accent, so only a near-white one disappears.
  function checkAccent(s) {
    var warn = $('renk-uyari');
    var light = Object.prototype.hasOwnProperty.call(LIGHT_SURFACE, s.stil);
    var ratio = contrast(s.renk, light ? LIGHT_SURFACE[s.stil] : DARK_SURFACE);
    var bad = light ? ratio < 1.6 : ratio < 3;
    warn.hidden = !bad;
    warn.textContent = bad ? t(light ? 'warn.accentLight' : 'warn.accentDark', { theme: labelOf('stil', s.stil), ratio: ratio.toFixed(1) }) : '';
  }

  // ---- Relay check -----------------------------------------------------------

  async function checkRelay() {
    var btn = $('relayKontrol');
    var box = $('relay-durum');
    var base = relayValue();
    btn.disabled = true;
    say(box, '', t('relay.checking'));
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 2000);
    try {
      var res = await fetch(K.relayUrl(base + '/health'), { signal: ctl.signal, cache: 'no-store' });
      if (res.status === 401) { say(box, 'err', t('relay.key')); return; }
      var data = res.ok ? await res.json() : null;
      if (!res.ok || !data || data.ok !== true) { say(box, 'err', t('relay.bad', { status: res.status })); return; }
      var f = data.features && typeof data.features === 'object' ? data.features : {};
      var feats = ['chat', 'channel', 'subscribers'].map(function (k) { return t('relay.f.' + k) + ' ' + (f[k] === true ? '✓' : '✗'); }).join(', ');
      say(box, 'ok', t('relay.ok', { v: String(data.version || '?').slice(0, 20), n: Number(data.clients) || 0, feats: feats }));
    } catch (e) {
      say(box, 'err', t('relay.down', { url: base }));
    } finally {
      clearTimeout(timer);
      btn.disabled = false;
    }
  }

  // ---- Export and import (public settings only) ---------------------------------

  var IMPORT_MAX = 100 * 1024;

  function exportSettings() {
    var s = currentSettings();
    var settings = {};
    K.schemaKeys().forEach(function (key) { settings[key] = s[key]; });
    if (relayValue() !== RELAY_DEFAULT) settings.relayAdresi = relayValue();
    var text = JSON.stringify({ app: 'kick-overlay-studio', version: 1, settings: settings }, null, 2) + '\n';
    try {
      download('kick-overlay-ayarlar.json', text, 'application/json;charset=utf-8');
      say($('yedek-durum'), 'ok', t('backup.exported'));
    } catch (e) {
      say($('yedek-durum'), 'err', t('out.dlFail'));
    }
  }

  function isPlainObject(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }

  // Whitelist first, then K.normalize: unknown keys, credentials and non-primitive values never get in.
  function importSettings(file) {
    var box = $('yedek-durum');
    if (!file) return;
    if (file.size > IMPORT_MAX) { say(box, 'err', t('backup.tooBig')); return; }
    var reader = new FileReader();
    reader.onerror = function () { say(box, 'err', t('backup.badFile')); };
    reader.onload = function () {
      var data;
      try { data = JSON.parse(String(reader.result)); } catch (e) { data = null; }
      var src = isPlainObject(data) && isPlainObject(data.settings) ? data.settings : data;
      if (!isPlainObject(src)) { say(box, 'err', t('backup.badFile')); return; }
      var allowed = K.schemaKeys().concat(['relayAdresi']);
      var picked = {};
      var count = 0, ignored = 0;
      Object.keys(src).forEach(function (key) {
        var v = src[key];
        var primitive = typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean';
        if (allowed.indexOf(key) >= 0 && primitive) { picked[key] = v; count++; } else { ignored++; }
      });
      if (!count) { say(box, 'err', t('backup.empty')); return; }
      writeForm(K.normalize(Object.assign(readRaw(), picked)));
      if (Object.prototype.hasOwnProperty.call(picked, 'relayAdresi')) {
        var r = K.normalizeLocal({ relayAdresi: picked.relayAdresi }).relayAdresi;
        relayEl.value = r === RELAY_DEFAULT ? '' : r;
      }
      update();
      say(box, 'ok', t('backup.imported', { n: count }) + (ignored ? t('backup.ignored', { n: ignored }) : ''));
    };
    reader.readAsText(file);
  }

  // ---- Main update ----------------------------------------------------------

  function update() {
    var s = currentSettings();
    document.documentElement.style.setProperty('--st-accent', s.renk);
    paintChoices();
    out.value = buildAyarlar(s);
    refreshCards(s);
    checkAccent(s);
    saveDraft();
    scheduleFrame();
  }

  // ---- Events ---------------------------------------------------------------

  function bindEvents() {
    form.addEventListener('submit', function (e) { e.preventDefault(); });

    form.addEventListener('input', function (e) {
      var el = e.target;
      if (el.id === 'renk') {
        $('renkMetin').value = el.value;
      } else if (el.id === 'renkMetin') {
        var v = el.value.trim();
        var h = v.charAt(0) === '#' ? v : '#' + v;
        if (HEX_RE.test(h)) $('renk').value = hex6(h).toLowerCase();
      }
      update();
    });

    // Blur or pick: write the normalized values back so the form shows what is used.
    form.addEventListener('change', function () {
      writeForm(currentSettings());
      if (relayEl.value.trim()) relayEl.value = relayValue();
      update();
    });

    document.querySelectorAll('[data-preset]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = PRESETS[btn.getAttribute('data-preset')];
        if (!p) return;
        writeForm(K.normalize(Object.assign(currentSettings(), p)));
        update();
      });
    });

    // Two-step reset: an inline question instead of a native dialog, so keyboard and screen readers stay in the page.
    var resetBox = $('sifirla-onay');
    function closeReset() { resetBox.hidden = true; $('sifirla').focus(); }
    $('sifirla').addEventListener('click', function () {
      resetBox.hidden = false;
      $('sifirlaIptal').focus();
    });
    $('sifirlaIptal').addEventListener('click', closeReset);
    resetBox.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeReset(); });
    $('sifirlaEvet').addEventListener('click', function () {
      var keep = currentSettings().kanal;
      writeForm(K.normalize({ kanal: keep }));
      relayEl.value = '';
      update();
      closeReset();
      toast(t('reset.done'));
    });

    $('pv-canli').addEventListener('click', toggleLive);
    $('hepsiniKopyala').addEventListener('click', copyAllLinks);
    $('relayKontrol').addEventListener('click', checkRelay);
    $('disaAktar').addEventListener('click', exportSettings);
    $('iceAktar').addEventListener('click', function () { $('iceAktarDosya').click(); });
    $('iceAktarDosya').addEventListener('change', function (e) {
      importSettings(e.target.files && e.target.files[0]);
      e.target.value = '';
    });

    document.querySelectorAll('[data-lang]').forEach(function (b) {
      b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
    });

    $('gizliGoster').addEventListener('change', function (e) {
      var type = e.target.checked ? 'text' : 'password';
      $('kickClientId').type = type;
      $('kickClientSecret').type = type;
    });

    // Changing the secret must drop any token the core cached for the old one.
    ['kickClientId', 'kickClientSecret'].forEach(function (id) {
      $(id).addEventListener('input', function () { K.official.clearToken(); });
    });

    $('indir').addEventListener('click', function () {
      try {
        download('AYARLAR.js', out.value, 'text/javascript;charset=utf-8');
        say(outStatus, 'ok', t('out.downloaded'));
      } catch (e) {
        say(outStatus, 'err', t('out.dlFail'));
      }
    });

    $('kopyala').addEventListener('click', copyOutput);
    kickTestBtn.addEventListener('click', testKick);
    $('yerelIndir').addEventListener('click', downloadLocal);

    window.addEventListener('resize', fitPreview);
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitPreview).observe(stage);
  }

  // ---- Init -----------------------------------------------------------------

  loadUi();
  buildChoices();
  buildPresets();
  buildTabs();
  buildCards();
  writeForm(K.normalize({}));
  loadDraft();
  bindEvents();
  applyI18n();
  setBackground(background);
  selectTab(activeId, false);
  update();
  fitPreview();
})();
</script>
</body>

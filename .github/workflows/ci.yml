name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      # Pinned to the commit behind each tag, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check (every tracked .js file)
        shell: bash
        run: git ls-files -z '*.js' ':!src/core/*' | xargs -0 -n1 node --check
      - name: Unit tests
        run: node tests/run.js
      - name: Relay tests
        run: node tests/relay-test.js

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: shared/kick-core.js is built from src/core
        run: node tools/build-core.js --check
      - name: shared/lang is built from i18n
        run: node tools/build-lang.js --check
      - name: Version in shared/kick-core.js matches package.json
        run: node tools/sync-version.js --check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Chrome end-to-end tests (offline pages, local relay, studio)
        run: node tests/e2e-chrome.js --relay
      - name: Visual quality gate (contrast and layout, every label language incl. right to left)
        run: node tools/visual-qa.js --out qa-out --only main,lang --gate
      - name: Keep the visual QA sheets when the gate fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-qa
          path: qa-out/
          retention-days: 7

  relay-executable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the single-file relay
        run: npm run build:relay
      - name: Smoke test the executable from an empty folder
        run: npm run test:relay-binary
      # The release step that puts the relay inside the overlay folder, run here so a tag is never its first run.
      - name: Release zip with the relay inside
        if: runner.os != 'Windows'
        run: bash tools/bundle-release.sh HEAD kick-streamer-overlays-ci dist

  # Server mode: the image builds, starts, answers only its public host, and never hands out the access key.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the relay image
        run: docker build -t kick-relay .
      - name: Start it in server mode and check it
        shell: bash
        run: |
          docker run -d --name relay -p 127.0.0.1:8790:8790 -e RELAY_PUBLIC_URL=https://overlays.example.test kick-relay
          for i in $(seq 1 30); do curl -sf -o /dev/null -H 'Host: overlays.example.test' http://127.0.0.1:8790/studio.html && break; sleep 1; done
          h='Host: overlays.example.test'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$h" http://127.0.0.1:8790/studio.html)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: other.example.test' http://127.0.0.1:8790/studio.html)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$h" http://127.0.0.1:8790/health)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$h" http://127.0.0.1:8790/kick/webhook)" = 401
          key=$(docker exec relay sed -E 's/.*"(.*)".*/\1/' /data/AYARLAR.relay.js)
          ! curl -s -H "$h" http://127.0.0.1:8790/AYARLAR.relay.js | grep -qF "$key"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$h" "http://127.0.0.1:8790/health?key=$key")" = 200
          echo "server mode checks passed"
      - name: Relay log
        if: always()
        run: docker logs relay 2>&1 | sed -E 's/[A-Za-z0-9_-]{32,}/***/g'

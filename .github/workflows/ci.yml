name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      # Pinned to the commit behind each tag (v4.4.0), so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check (every tracked .js file)
        shell: bash
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check
      - name: Unit tests
        run: node tests/run.js
      - name: Relay tests
        run: node tests/relay-test.js

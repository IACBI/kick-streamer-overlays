name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      # Pinned to the commit behind each tag (v4.4.0), so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check (every tracked .js file)
        shell: bash
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check
      - name: Unit tests
        run: node tests/run.js
      - name: Relay tests
        run: node tests/relay-test.js

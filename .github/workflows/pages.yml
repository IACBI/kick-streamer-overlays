name: Pages

# Publishes the studio and the overlay pages to GitHub Pages, so anyone can try them without downloading.
# Only the files the pages load are published: no tests, tools, relay or settings files with secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect the site
        run: |
          mkdir -p _site
          # Tracked files only, so git-ignored local files (AYARLAR.local.js, AYARLAR.relay.js) can never be published.
          git ls-files -z -- ':(glob)*.html' 'AYARLAR.js' 'shared/' 'alerts/' 'badges/' 'branding/' 'LICENSE' \
            | xargs -0 -I{} cp --parents {} _site/
          test -f _site/studio.html
          # The site root opens the studio.
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Kick Overlay Studio</title>' \
            '<meta http-equiv="refresh" content="0; url=studio.html"><a href="studio.html">Kick Overlay Studio</a>' > _site/index.html
          ls -R _site | head -50
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

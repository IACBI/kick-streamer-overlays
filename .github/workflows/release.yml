name: Release

# Pushing a tag vX.Y.Z publishes the GitHub release: the overlay folder as a zip, the relay
# executables for Windows and Linux, SHA256SUMS.txt, and the CHANGELOG.md section as notes.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json and kick-core.js
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          node tools/sync-version.js --check
      - name: Release notes exist
        run: node tools/changelog-notes.js "$GITHUB_REF_NAME" > /dev/null
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  relay-executable:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:relay
      - run: npm run test:relay-binary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-${{ matrix.os }}
          path: dist/kick-relay-*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: relay-executable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relay-*
          path: out
          merge-multiple: true
      - name: Overlay folder as a zip (tracked files at the tag)
        run: git archive --format=zip --prefix="kick-streamer-overlays-${GITHUB_REF_NAME}/" -o "out/kick-streamer-overlays-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"
      - name: Checksums
        working-directory: out
        run: |
          chmod +x kick-relay-linux-x64
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/changelog-notes.js "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md out/*

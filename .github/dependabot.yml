version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same CodeQL version; separate PRs would each fail CI.
      codeql:
        patterns: ['github/codeql-action*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Dev tools only (lint, type check, relay build); the overlays and the relay have no runtime dependencies.
    groups:
      dev-tools:
        patterns: ['*']
    ignore:
      # The types follow the oldest supported Node.js (engines: >=20), not the newest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Subscriber Bar</title>
<!-- OBS Browser source (Local file): 520 x 90. Subscriber goal bar. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.local.js"></script>
<script src="AYARLAR.relay.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px;
    font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .wrap { width: 100%; max-width: 488px; }
  .ko-chip[hidden], .ko-hint[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ko-bar" id="bar">
    <div class="ko-fill" id="fill"></div>
    <div class="ko-row">
      <span class="ko-cur"><span id="val">0</span><span class="ko-chip" id="delta" hidden></span><span class="ko-chip" id="pct" hidden></span></span>
      <span class="ko-label"><span id="lbl"></span></span>
      <span class="ko-goal" id="goal">0</span>
    </div>
    <div class="ko-hint" id="hint" hidden></div>
  </div>
</div>
<div class="ko-note is-hidden" id="note" aria-live="polite"></div>
<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const PREVIEW = K.isPreview();
  K.applyLook(S);
  K.loadFont(S);
  const T = K.text(S);

  const $ = (id) => document.getElementById(id);
  const note = $('note'), hint = $('hint');
  const GOAL = S.aboneHedefi;
  // Poll statuses that are a normal answer; anything else backs the poller off.
  const FINE = { ok: 1, manual: 1, 'no-data': 1, 'no-channel': 1 };

  $('lbl').textContent = K.label(S, 'Abone', 'Subscriber');
  $('goal').textContent = K.fmt(GOAL);

  const bar = K.createGoalBar({
    bar: $('bar'), fill: $('fill'), val: $('val'), pct: $('pct'), delta: $('delta')
  }, GOAL, S);

  // total is null until the first real value; the note then says Kick could not be reached, not "last value".
  function noteFor(r) {
    switch (r.status) {
      case 'auth': return T.auth;
      case 'rate': return T.rate;
      case 'error': return r.total === null ? T.unreachable : T.error;
      case 'no-data':
      case 'no-credentials': return T.noData;
      default: return '';
    }
  }

  function show(r) {
    bar.set(r.total === null ? 0 : r.total, r.delta);
    K.note(note, S, noteFor(r));
  }

  // Preview (?onizleme=1): sample values, no source and no timer.
  if (PREVIEW) { show({ total: K.sample.subs, delta: K.sample.delta, status: 'manual' }); K.debug({ mode: 'preview' }); return; }

  if (!S.kanal) {
    hint.textContent = T.hint;
    hint.hidden = false;
  }

  const src = K.createSubscriberSource(S);
  let poller = null;
  let debugTimer = null;

  async function poll() {
    const r = await src.poll();
    show(r);
    K.debug({
      src: r.mode,
      status: r.status,
      'last poll': new Date().toLocaleTimeString()
    });
    return { ok: !!FINE[r.status], retryAfterMs: r.retryAfterMs };
  }

  // Without a channel nothing is requested: a manual count (aboneSayisi) is shown once.
  if (!S.kanal) { poll(); return; }

  poller = K.poller(poll, { intervalMs: S.yenilemeSn * 1000 });
  poller.start();
  if (K.isDebug()) {
    debugTimer = setInterval(function () {
      const ms = poller.nextInMs();
      K.debug({ 'next poll': ms === null ? '-' : Math.ceil(ms / 1000) + 's' });
    }, 1000);
  }
  window.addEventListener('pagehide', function () {
    poller.stop();
    bar.destroy();
    if (debugTimer !== null) clearInterval(debugTimer);
  });
})();
</script>
</body>
</html>

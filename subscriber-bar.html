<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Subscriber Bar</title>
<!-- OBS Browser source size: 520 x 90 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.local.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px;
    font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .wrap { width: 100%; max-width: 488px; }
  .ko-chip[hidden], .ko-hint[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ko-bar" id="bar">
    <div class="ko-fill" id="fill"></div>
    <div class="ko-row">
      <span class="ko-cur"><span id="val">0</span><span class="ko-chip" id="delta" hidden></span><span class="ko-chip" id="pct" hidden></span></span>
      <span class="ko-label"><span id="lbl"></span></span>
      <span class="ko-goal" id="goal">0</span>
    </div>
    <div class="ko-hint" id="hint" hidden></div>
  </div>
</div>
<div class="ko-note is-hidden" id="note"></div>
<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const PREVIEW = K.isPreview();
  K.applyLook(S);

  const $ = (id) => document.getElementById(id);
  const bar = $('bar'), fill = $('fill'), val = $('val'), deltaEl = $('delta'), pctEl = $('pct');
  const note = $('note'), hint = $('hint');
  const GOAL = S.aboneHedefi;
  const NOTES = {
    auth: 'Kick uygulama bilgisi hatalı — AYARLAR.local.js',
    rate: "Kick'e ulaşılamadı, son değer gösteriliyor",
    error: "Kick'e ulaşılamadı, son değer gösteriliyor",
    'no-data': 'Kick bu kanal için abone verisi döndürmedi'
  };

  $('lbl').textContent = K.label(S, 'Abone', 'Subscriber');
  $('goal').textContent = K.fmt(GOAL);

  let shown = 0, lastTotal = null, cancelAnim = null, busy = false;

  function bump() {
    bar.classList.remove('ko-bump');
    void bar.offsetWidth;
    bar.classList.add('ko-bump');
  }

  function show(r) {
    const total = r.total === null ? 0 : r.total;

    fill.style.width = K.pct(total, GOAL) + '%';
    if (cancelAnim) cancelAnim();
    cancelAnim = K.tween(shown, total, S.animasyon === 'off' ? 0 : 1300, function (v) {
      shown = v;
      val.textContent = K.fmt(v);
    });
    if (lastTotal !== null && total > lastTotal) bump();
    lastTotal = total;

    const showDelta = S.oturumFarkiGoster && r.delta !== 0;
    deltaEl.hidden = !showDelta;
    if (showDelta) {
      deltaEl.textContent = (r.delta > 0 ? '+' : '-') + K.fmt(Math.abs(r.delta));
      deltaEl.classList.toggle('is-neg', r.delta < 0);
    }

    pctEl.hidden = !S.yuzdeGoster;
    if (S.yuzdeGoster) pctEl.textContent = Math.round(K.pct(total, GOAL)) + '%';

    const text = NOTES[r.status] || '';
    note.textContent = text;
    note.classList.toggle('is-hidden', !text);
  }

  // Preview (?onizleme=1): sample values, no source and no timer.
  if (PREVIEW) { show({ total: K.sample.subs, delta: K.sample.delta, status: 'manual' }); return; }

  if (!S.kanal) {
    hint.textContent = '⚙ AYARLAR.js → kanal / set your channel';
    hint.hidden = false;
  }

  const src = K.createSubscriberSource(S);

  async function poll() {
    if (busy) return;
    busy = true;
    try { show(await src.poll()); } finally { busy = false; }
  }

  let timer = null;
  if (src.mode === 'manual') {
    poll();
  } else if (S.kanal) {
    poll();
    timer = setInterval(poll, S.yenilemeSn * 1000);
  } else {
    show({ total: null, delta: 0, status: 'no-channel' });
  }
  window.addEventListener('pagehide', function () {
    if (timer !== null) clearInterval(timer);
    if (cancelAnim) cancelAnim();
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<!-- OBS: Browser source, Local file. Size 520 x 90. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Follower Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.local.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    position: relative; box-sizing: border-box; padding: 16px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font); -webkit-font-smoothing: antialiased;
  }
  .ko-bar { width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="ko-bar" id="bar">
  <div class="ko-fill" id="fill"></div>
  <div class="ko-row">
    <span class="ko-cur"><span id="cur">0</span><span class="ko-chip" id="pct" hidden></span></span>
    <span class="ko-label"><span id="lbl"></span></span>
    <span class="ko-goal" id="goal"></span>
  </div>
</div>
<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const PREVIEW = K.isPreview();
  K.applyLook(S);

  const elBar = document.getElementById('bar');
  const elFill = document.getElementById('fill');
  const elCur = document.getElementById('cur');
  const elPct = document.getElementById('pct');
  const elLbl = document.getElementById('lbl');
  const elGoal = document.getElementById('goal');

  elLbl.textContent = K.label(S, 'Takipçi', 'Follower');
  elGoal.textContent = K.fmt(S.takipciHedefi);

  let displayed = 0;      // number currently on screen (mid-tween safe)
  let target = null;      // last value painted
  let lastGood = null;    // last value Kick returned; kept when a poll fails
  let cancelTween = null;

  function paint(v){
    if (v === target) return;
    target = v;
    const pct = K.pct(v, S.takipciHedefi);
    elFill.style.width = pct + '%';
    elPct.hidden = !S.yuzdeGoster;
    elPct.textContent = Math.round(pct) + '%';
    if (cancelTween) cancelTween();
    cancelTween = K.tween(displayed, v, S.animasyon === 'off' ? 0 : 1300, function(x){
      displayed = x;
      elCur.textContent = K.fmt(x);
    });
  }

  let busy = false;
  async function poll(){
    if (busy) return;
    busy = true;
    try {
      const r = await K.kick.channel(S.kanal);
      const n = r.ok ? K.parse.followers(r.data) : null;
      if (n !== null) lastGood = n;
      paint(lastGood !== null ? lastGood : S.takipciYedek);
    } finally { busy = false; }
  }

  function showHint(){
    const h = document.createElement('div');
    h.className = 'ko-hint';
    h.textContent = '⚙ AYARLAR.js → kanal / set your channel';
    elBar.appendChild(h);
  }

  // Preview (?onizleme=1): sample value only. No request and no timer.
  if (PREVIEW) { paint(K.sample.followers); return; }

  if (!S.kanal) { paint(S.takipciYedek); showHint(); return; }
  poll();
  const timer = setInterval(poll, S.yenilemeSn * 1000);
  window.addEventListener('pagehide', function(){
    clearInterval(timer);
    if (cancelTween) cancelTween();
  });
})();
</script>
</body>
</html>

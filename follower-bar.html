<!DOCTYPE html>
<!-- OBS Browser source (Local file): 520 x 90. Follower goal bar. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Follower Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.relay.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    position: relative; box-sizing: border-box; padding: 16px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font); -webkit-font-smoothing: antialiased;
  }
  .ko-bar { width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="ko-bar" id="bar">
  <div class="ko-fill" id="fill"></div>
  <div class="ko-row">
    <span class="ko-cur"><span id="cur">0</span><span class="ko-chip" id="pct" hidden></span></span>
    <span class="ko-label"><span id="lbl"></span></span>
    <span class="ko-goal" id="goal"></span>
  </div>
</div>
<div class="ko-note is-hidden" id="note" aria-live="polite"></div>
<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const PREVIEW = K.isPreview();
  K.applyLook(S);
  K.loadFont(S);
  const T = K.text(S);

  const elBar = document.getElementById('bar');
  const elLbl = document.getElementById('lbl');
  const elGoal = document.getElementById('goal');
  const elNote = document.getElementById('note');

  elLbl.textContent = K.label(S, 'Takipçi', 'Follower');
  elGoal.textContent = K.fmt(S.takipciHedefi);

  const bar = K.createGoalBar({
    bar: elBar,
    fill: document.getElementById('fill'),
    val: document.getElementById('cur'),
    pct: document.getElementById('pct'),
    delta: null
  }, S.takipciHedefi, S);

  let lastGood = null;    // last value Kick returned; kept when a poll fails
  let poller = null;
  let debugTimer = null;

  // The fallback count is shown on a failed first poll, but never without a note saying so.
  async function poll(){
    const r = await K.kick.channel(S.kanal, S);
    const n = r.ok ? K.parse.followers(r.data) : null;
    if (n !== null) {
      lastGood = n;
      bar.set(n);
      K.note(elNote, S, '');
    } else {
      if (lastGood === null) bar.set(S.takipciYedek);
      K.note(elNote, S, lastGood === null ? T.unreachable : r.status === 429 ? T.rate : T.error);
    }
    K.debug({
      src: r.src || '-',
      status: n !== null ? 'ok' : (r.status || r.error || 'error'),
      'last poll': new Date().toLocaleTimeString()
    });
    return { ok: n !== null, retryAfterMs: r.retryAfterMs };
  }

  function showHint(){
    const h = document.createElement('div');
    h.className = 'ko-hint';
    h.textContent = T.hint;
    elBar.appendChild(h);
  }

  // Preview (?onizleme=1): sample value only. No request and no timer.
  if (PREVIEW) { bar.set(K.sample.followers); K.debug({ mode: 'preview' }); return; }

  if (!S.kanal) { bar.set(S.takipciYedek); showHint(); K.debug({ mode: 'no channel' }); return; }

  poller = K.poller(poll, { intervalMs: S.yenilemeSn * 1000 });
  poller.start();
  if (K.isDebug()) {
    debugTimer = setInterval(function(){
      const ms = poller.nextInMs();
      K.debug({ 'next poll': ms === null ? '-' : Math.ceil(ms / 1000) + 's' });
    }, 1000);
  }
  window.addEventListener('pagehide', function(){
    poller.stop();
    bar.destroy();
    if (debugTimer !== null) clearInterval(debugTimer);
  });
})();
</script>
</body>
</html>

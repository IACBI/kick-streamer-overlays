<!DOCTYPE html>
<!-- OBS control dock: Docks → Custom Browser Docks, with this file's link as the URL. Needs the relay (relay/). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Overlay Dock</title>
<link rel="icon" href="branding/logo.svg" type="image/svg+xml">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.relay.js"></script>
<script src="shared/lang/tr.js"></script>
<script src="shared/lang/en.js"></script>
<script src="shared/lang/es.js"></script>
<script src="shared/lang/pt.js"></script>
<script src="shared/lang/de.js"></script>
<script src="shared/lang/ar.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  :root {
    --bg: #1b1d23; --panel: #23262e; --line: #343844; --text: #e8eaef; --muted: #a3a9b6;
    --accent: #53fc18; --on-accent: #0b0d10; --ok: #53fc18; --warn: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  main { padding: 10px; display: grid; gap: 10px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
  h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    flex: 1 1 auto; min-width: 72px; min-height: 32px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: #2d313b; color: var(--text); font: inherit; font-weight: 600;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  #status { display: flex; align-items: center; gap: 8px; }
  #dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  #dot.ok { background: var(--ok); } #dot.warn { background: var(--warn); } #dot.err { background: var(--err); }
  .field { display: grid; gap: 4px; flex: 1 1 90px; min-width: 0; color: var(--muted); font-size: 12px; }
  .field.grow { flex: 3 1 160px; }
  input {
    width: 100%; min-height: 32px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #msg { min-height: 1.4em; color: var(--muted); }
  #msg.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <section aria-labelledby="h-status">
    <h2 id="h-status"></h2>
    <div id="status" role="status"><span id="dot" aria-hidden="true"></span><span id="status-text"></span></div>
  </section>
  <section aria-labelledby="h-alerts">
    <h2 id="h-alerts"></h2>
    <div class="row">
      <button type="button" id="pause" class="primary"></button>
      <button type="button" id="skip"></button>
      <button type="button" id="replay"></button>
    </div>
  </section>
  <section aria-labelledby="h-test">
    <h2 id="h-test"></h2>
    <div class="row" id="tests"></div>
  </section>
  <section aria-labelledby="h-countdown">
    <h2 id="h-countdown"></h2>
    <div class="row">
      <label class="field"><span id="l-cd-min"></span><input id="cd-min" type="number" min="0" max="720" step="1" inputmode="numeric" /></label>
      <label class="field grow"><span id="l-cd-title"></span><input id="cd-title" type="text" maxlength="60" /></label>
    </div>
    <div class="row"><button type="button" id="cd-start"></button></div>
  </section>
  <section aria-labelledby="h-ticker">
    <h2 id="h-ticker"></h2>
    <label class="field"><span id="l-tk-lines"></span><input id="tk-lines" type="text" maxlength="400" /></label>
    <div class="row">
      <button type="button" id="tk-send"></button>
      <button type="button" id="tk-reset"></button>
    </div>
  </section>
  <section aria-labelledby="h-stats">
    <h2 id="h-stats"></h2>
    <div class="row"><button type="button" id="st-reset"></button></div>
  </section>
  <p id="msg" role="status" aria-live="polite"></p>
</main>

<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const L = (key, vars) => K.t(S, key, vars);
  const BASE = S.relayAdresi;
  const HEALTH_MS = 5000;
  const TIMEOUT_MS = 2500;
  const KINDS = ['follow', 'sub', 'gift', 'kicks', 'reward'];

  const $ = (id) => document.getElementById(id);
  const dot = $('dot'), statusText = $('status-text'), msg = $('msg');
  const pauseBtn = $('pause'), skipBtn = $('skip'), replayBtn = $('replay');
  let paused = false, reachable = false, healthTimer = null;

  K.useLang(S);
  $('h-status').textContent = L('dock.relay');
  $('h-alerts').textContent = L('dock.alerts');
  $('h-test').textContent = L('dock.test');
  skipBtn.textContent = L('dock.skip');
  replayBtn.textContent = L('dock.replay');
  for (const kind of KINDS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = L('dock.kind.' + kind);
    b.addEventListener('click', () => send('/test-alert?kind=' + kind, b));
    $('tests').appendChild(b);
  }

  function say(text, isErr){ msg.textContent = text; msg.className = isErr ? 'err' : ''; }

  function renderPause(){
    pauseBtn.textContent = paused ? L('dock.resume') : L('dock.pause');
    pauseBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
  }

  function setControls(on){
    document.querySelectorAll('button').forEach((b) => { b.disabled = !on; });
  }

  async function call(path, method){
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(K.relayUrl(BASE + path), { method, signal: ctl.signal, cache: 'no-store' });
      let data = null;
      try { data = await res.json(); } catch (e) { /* not JSON */ }
      return { status: res.status, data };
    } finally {
      clearTimeout(timer);
    }
  }

  async function health(){
    if (K.relayBlocked()) return showDown(K.relayBlockedNote(S));
    try {
      const r = await call('/health', 'GET');
      if (r.status === 401) return showDown(L('dock.keyBad'));
      if (r.status !== 200 || !r.data || r.data.ok !== true) return showDown(L('dock.odd'));
      reachable = true;
      paused = r.data.alertsPaused === true;
      const n = Number(r.data.clients) || 0;
      dot.className = n ? 'ok' : 'warn';
      statusText.textContent = L('dock.running') + ' · v' + String(r.data.version || '?').slice(0, 20) + ' · ' +
        L('dock.connected', { n }) + (paused ? ' · ' + L('dock.paused') : '');
      setControls(true);
      renderPause();
    } catch (e) {
      showDown(L('dock.down'));
    }
  }

  function showDown(text){
    reachable = false;
    dot.className = 'err';
    statusText.textContent = text;
    setControls(false);
  }

  async function send(path, btn){
    if (!reachable) return;
    btn.disabled = true;
    try {
      const r = await call(path, 'POST');
      if (r.status === 200) say(r.data && r.data.clients === 0 ? L('dock.sentNone') : L('dock.done'));
      else if (r.status === 409) say(L('dock.noReplay'), true);
      else if (r.status === 429) say(L('dock.wait'), true);
      else say(L('dock.refused', { status: r.status }), true);
    } catch (e) {
      say(L('dock.unreachable'), true);
    } finally {
      btn.disabled = false;
      health();
    }
  }

  pauseBtn.addEventListener('click', () => send('/control?action=' + (paused ? 'resume' : 'pause'), pauseBtn));
  skipBtn.addEventListener('click', () => send('/control?action=skip', skipBtn));
  replayBtn.addEventListener('click', () => send('/control?action=replay', replayBtn));

  $('h-countdown').textContent = L('dock.countdown');
  $('l-cd-min').textContent = L('dock.minutes');
  $('l-cd-title').textContent = L('dock.title');
  $('cd-start').textContent = L('dock.cdStart');
  $('h-ticker').textContent = L('dock.ticker');
  $('l-tk-lines').textContent = L('dock.lines');
  $('tk-send').textContent = L('dock.tkSend');
  $('tk-reset').textContent = L('dock.tkReset');
  $('cd-min').value = String(S.geriSayimDk);
  $('cd-title').value = S.geriSayimBaslik;
  $('tk-lines').value = S.duyuruMetinleri;

  $('cd-start').addEventListener('click', (e) => {
    const min = Number($('cd-min').value);
    if (!Number.isInteger(min) || min < 0 || min > 720) { say(L('dock.badMinutes'), true); return; }
    send('/overlay?' + new URLSearchParams({ target: 'countdown', minutes: String(min), title: $('cd-title').value.trim() }), e.currentTarget);
  });
  $('tk-send').addEventListener('click', (e) => {
    const lines = $('tk-lines').value.trim();
    if (!lines.replace(/\|/g, '').trim()) { say(L('dock.needLine'), true); return; }
    send('/overlay?' + new URLSearchParams({ target: 'ticker', lines }), e.currentTarget);
  });
  $('tk-reset').addEventListener('click', (e) => send('/overlay?target=ticker&reset=1', e.currentTarget));

  // Clearing the stream's numbers cannot be undone, so it takes a second press within a few seconds.
  const CONFIRM_MS = 4000;
  const stReset = $('st-reset');
  let armTimer = null;
  const disarm = () => { if (armTimer !== null) clearTimeout(armTimer); armTimer = null; stReset.textContent = L('dock.stReset'); };
  $('h-stats').textContent = L('dock.stats');
  disarm();
  stReset.addEventListener('click', (e) => {
    if (armTimer === null) {
      stReset.textContent = L('dock.sure');
      armTimer = setTimeout(disarm, CONFIRM_MS);
      return;
    }
    disarm();
    send('/stats/reset', e.currentTarget);
  });

  renderPause();
  setControls(false);
  statusText.textContent = L('dock.checking');
  health();
  healthTimer = setInterval(health, HEALTH_MS);
  window.addEventListener('pagehide', () => { clearInterval(healthTimer); disarm(); });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<!-- OBS: Browser source, Local file. Size 300 x 80. Hidden while the channel is offline. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Viewer + Uptime Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.local.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    position: relative; box-sizing: border-box; padding: 14px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font); -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  /* Calm icon animations: the eye iris looks around and blinks, the clock hand turns in quarter steps. */
  .eye-iris { animation: eyeLook 14s ease-in-out infinite; }
  @keyframes eyeLook {
    0%, 16%   { transform: translate(0, 0); }
    22%, 34%  { transform: translate(-1.7px, 0); }
    40%, 52%  { transform: translate(1.7px, 0); }
    58%, 68%  { transform: translate(0, -1.3px); }
    74%, 84%  { transform: translate(0, 1.3px); }
    90%, 100% { transform: translate(0, 0); }
  }
  .eye { transform-origin: 50% 50%; animation: eyeBlink 6.5s ease-in-out infinite; }
  @keyframes eyeBlink {
    0%, 90%, 100% { transform: scaleY(1); }
    93%           { transform: scaleY(.08); }
    96%           { transform: scaleY(1); }
  }
  .clock-hands { transform-box: view-box; transform-origin: 12px 12px; animation: clockTurn 20s ease-in-out infinite; }
  @keyframes clockTurn {
    0%   { transform: rotate(0deg); }
    6%   { transform: rotate(90deg); }
    25%  { transform: rotate(90deg); }
    31%  { transform: rotate(180deg); }
    50%  { transform: rotate(180deg); }
    56%  { transform: rotate(270deg); }
    75%  { transform: rotate(270deg); }
    81%  { transform: rotate(360deg); }
    100% { transform: rotate(360deg); }
  }
  body.motion-low .eye-iris, body.motion-low .eye, body.motion-low .clock-hands,
  body.motion-off .eye-iris, body.motion-off .eye, body.motion-off .clock-hands,
  body.motion-off .ko-dot { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .eye-iris, .eye, .clock-hands { animation: none; }
  }
</style>
</head>
<body>
<div class="ko-panel is-off" id="panel">
  <span class="ko-dot"></span>
  <span class="ko-stat">
    <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.6 12S5.5 4.8 12 4.8 22.4 12 22.4 12 18.5 19.2 12 19.2 1.6 12 1.6 12Z"/><circle class="eye-iris" cx="12" cy="12" r="3.2"/></svg>
    <span class="ko-val" id="viewers">0</span>
  </span>
  <span class="ko-sep-v"></span>
  <span class="ko-stat">
    <svg class="clock" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path class="clock-hands" d="M12 7.2V12l3.4 2"/></svg>
    <span class="ko-val" id="uptime">0:00:00</span>
  </span>
</div>
<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const PREVIEW = K.isPreview();
  K.applyLook(S);

  const elPanel = document.getElementById('panel');
  const elViewers = document.getElementById('viewers');
  const elUptime = document.getElementById('uptime');
  const tweenMs = S.animasyon === 'off' ? 0 : 700;

  let live = false;
  let startMs = null;
  let shownViewers = 0;
  let cancelViewers = null;
  let ticker = null;      // runs only while the channel is live
  let busy = false;

  function setViewers(target){
    if (cancelViewers) cancelViewers();
    cancelViewers = K.tween(shownViewers, target, tweenMs, function(x){
      shownViewers = x;
      elViewers.textContent = K.fmt(x);
    });
  }

  const pad = (n) => String(n).padStart(2, '0');
  function tickUptime(){
    if (!live || startMs === null) return;
    let s = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    elUptime.textContent = h + ':' + pad(m) + ':' + pad(s);
  }

  function startTicker(){
    if (ticker === null) ticker = setInterval(tickUptime, 1000);
  }
  function stopTicker(){
    if (ticker !== null) { clearInterval(ticker); ticker = null; }
  }

  function apply(info){
    if (!info.live) {
      live = false;
      startMs = null;
      stopTicker();
      if (cancelViewers) cancelViewers();
      shownViewers = 0;
      elPanel.classList.add('is-off');
      return;
    }
    live = true;
    if (info.startMs !== null) startMs = info.startMs;
    else if (startMs === null) startMs = Date.now();
    elPanel.classList.remove('is-off');
    setViewers(info.viewers);
    tickUptime();
    startTicker();
  }

  async function poll(){
    if (busy) return;
    busy = true;
    try {
      const r = await K.kick.channel(S.kanal);
      if (!r.ok) return;   // failed poll: keep the current state
      apply(K.parse.live(r.data));
    } finally { busy = false; }
  }

  function showHint(){
    const h = document.createElement('div');
    h.className = 'ko-hint';
    h.textContent = '⚙ AYARLAR.js → kanal / set your channel';
    document.body.appendChild(h);
  }

  // Preview (?onizleme=1): live state from the sample values. The uptime counts from the sample offset.
  if (PREVIEW) {
    apply({ live: true, viewers: K.sample.viewers, startMs: Date.now() - K.sample.startMs });
    return;
  }

  if (!S.kanal) { showHint(); return; }
  poll();
  const pollTimer = setInterval(poll, S.yenilemeSn * 1000);
  window.addEventListener('pagehide', function(){
    clearInterval(pollTimer);
    stopTicker();
    if (cancelViewers) cancelViewers();
  });
})();
</script>
</body>
</html>

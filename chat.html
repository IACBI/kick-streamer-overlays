<!DOCTYPE html>
<!-- OBS Browser source (Local file): 460 x 760. Chat overlay. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Chat Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.relay.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ width:100%; height:100%; overflow:hidden; background:transparent; }
  body{ padding:14px; font-family:var(--font); -webkit-font-smoothing:antialiased; }
  /* Badge art: the image is the badge, so no pill background or box shadow. */
  .ko-badge-art{ background:none; box-shadow:none; padding:0; min-width:0; height:18px; }
  .ko-badge-art img{ height:18px; width:auto; display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.45)); }
  .ko-badge .ko-count{ font-size:11px; }
</style>
</head>
<body>
<div class="ko-feed" id="feed"></div>
<div class="ko-note is-hidden" id="note" aria-live="polite"></div>

<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const PREVIEW = K.isPreview();
  K.applyLook(S);
  const fontLink = K.loadFont(S);
  const T = K.text(S);

  const feed = document.getElementById('feed');
  const noteEl = document.getElementById('note');
  const MAX = S.sohbetMaksMesaj;
  // Fallbacks for the .ko-msg.is-leaving (.4s) and .is-fading (.6s) animations in themes.css;
  // the real length is read from the element when it leaves.
  const LEAVE_MS = 400;
  const SEEN_CAP = 500;
  const FADE_MS = 600;
  const reduceMq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  // Web Animations cannot take var(), so the motion token is read once; the fallback is the same curve.
  const FLIP_EASE = (window.getComputedStyle(document.documentElement).getPropertyValue('--ko-ease') || '').trim() || 'cubic-bezier(.2, .8, .2, 1)';
  const RELAY_DOWN_MS = 5000;
  const EMOTE_MAX = 10;
  // Only hex (#rgb or #rrggbb, as in kick-core) reaches the CSS as a name colour.
  const HEX_RE = /^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i;
  // Badge art only from Kick's own hosts; anything else falls back to the drawn badge.
  const BADGE_SRC_RE = /^https:\/\/(?:files\.|api\.|id\.)?kick\.com\/[A-Za-z0-9._~\/%?=&+-]+$/;
  const EMOTE_RE = /\[emote:(\d+):([^\]]+)\]/g;
  const BROADCASTER = new Set(['broadcaster', 'owner', 'host']);
  // The default label follows the label language; a name the streamer typed is shown as written.
  const BCAST_LABEL = S.yayinciYazisi === 'Streamer' ? K.label(S, 'Yayıncı', 'Streamer') : S.yayinciYazisi;
  const HIDDEN_USERS = new Set(S.sohbetGizliKullanicilar.split(',')
    .map(n => n.trim().replace(/^@/, '').toLowerCase()).filter(Boolean));
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const STROKE = { fill:'none', stroke:'#fff', 'stroke-width':'2.2', 'stroke-linecap':'round', 'stroke-linejoin':'round' };
  const P = d => ['path', { d: d }];

  // Drawn role symbols, as [tag, attributes]. Built with createElementNS, never from markup strings.
  const ICON = {
    moderator: { els: [P('M12 3l7 2.7v5.1c0 4.2-2.9 7.5-7 8.7-4.1-1.2-7-4.5-7-8.7V5.7L12 3z'), P('M8.6 11.8l2.2 2.2 4-4.2')] },
    vip: { els: [P('M3.5 9l4-5h9l4 5L12 21 3.5 9z'), P('M3.5 9h17')] },
    og: { els: [['circle', { cx:12, cy:9, r:5 }], P('M8.6 13.1L7 21l5-2.7L17 21l-1.6-7.9')] },
    founder: { els: [P('M6 3v18'), P('M6 4h11l-2.3 3.4L17 11H6')] },
    subscriber: { fill: true, els: [P('M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6 6.8 19.4l1-5.9L3.5 9.4l5.9-.8L12 3.2z')] },
    sub_gifter: { sw: '2', els: [['rect', { x:4, y:10, width:16, height:10, rx:1 }], P('M3 7h18v3H3zM12 7v13'), P('M12 7C12 7 11.4 3.5 9 4c-1.9.4-1.4 3 3 3zM12 7c0 0 .6-3.5 3-3 1.9.4 1.4 3-3 3z')] },
    verified: { els: [['circle', { cx:12, cy:12, r:8.5 }], P('M8.3 12.2l2.5 2.5 4.9-5')] },
    staff: { els: [P('M12 3l7 2.7v5.1c0 4.2-2.9 7.5-7 8.7-4.1-1.2-7-4.5-7-8.7V5.7L12 3z'), P('M12 8.5v4'), P('M12 15.4h.01')] }
  };
  const BADGE_COLOR = {
    moderator:'#16c172', vip:'#ec4899', og:'#f0b429', founder:'#ef5350',
    subscriber:'#4f46e5', sub_gifter:'#115e59', verified:'#2aa3ff', staff:'#0b8f3a'
  };

  const seen = new Set();   // dedupe guard; a Set keeps insertion order, so the oldest key is evicted first
  let subBadges = [];       // [{months, src}] sorted high -> low, from K.parse.subBadges
  let stopChat = null;      // from K.connectRelay
  let previewTimer = null;
  let fadeTimer = null;     // sweeps old messages when sohbetSilinmeSn > 0
  let downTimer = null;     // waits RELAY_DOWN_MS before the relay note shows
  let closing = false;
  let msgTotal = 0;         // messages shown so far, for ?debug=1

  function own(map, key){ return Object.hasOwn(map, key) ? map[key] : null; }

  function countOf(b){
    const n = Math.trunc(Number(b && b.count));
    return Number.isSafeInteger(n) && n > 0 ? n : 0;
  }

  function roleIcon(type){
    const def = own(ICON, type);
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    const attrs = def.fill ? { fill:'#fff', stroke:'none' } : Object.assign({}, STROKE, { 'stroke-width': def.sw || '2.2' });
    Object.keys(attrs).forEach(k => svg.setAttribute(k, attrs[k]));
    def.els.forEach(([tag, a]) => {
      const node = document.createElementNS(SVG_NS, tag);
      Object.keys(a).forEach(k => node.setAttribute(k, String(a[k])));
      svg.appendChild(node);
    });
    return svg;
  }

  function pill(type, count){
    const span = document.createElement('span');
    span.className = 'ko-badge';
    span.style.backgroundColor = own(BADGE_COLOR, type) || '#4b5563';
    span.appendChild(roleIcon(type));
    if(count > 0 && (type === 'subscriber' || type === 'sub_gifter')){
      const c = document.createElement('span');
      c.className = 'ko-count';
      c.textContent = String(count);
      span.appendChild(c);
    }
    return span;
  }

  // Optional art: badges/<name>.<ext> replaces the drawn symbol. A missing file falls back to it.
  const LOCAL_FILE = { moderator:'moderator', vip:'vip', og:'og', founder:'founder', verified:'verified', sub_gifter:'gifter', staff:'staff' };
  const LOCAL_EXT = ['svg', 'png', 'webp', 'gif', 'jpg', 'jpeg'];
  const localSrc = new Map();   // type -> resolved src, or false when no file exists
  const probes = new Map();     // type -> pending probe, shared by every message of a burst

  function canLoad(src){
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = src;
    });
  }

  // Tries each extension once per badge type, however many messages ask at the same time.
  function probeBadge(type){
    let p = probes.get(type);
    if(!p){
      const base = own(LOCAL_FILE, type);
      p = (async () => {
        for(const ext of LOCAL_EXT){
          const src = 'badges/' + base + '.' + ext;
          if(await canLoad(src)) return src;
        }
        return false;
      })().then(src => { localSrc.set(type, src); return src; });
      probes.set(type, p);
    }
    return p;
  }

  function badgeArt(type, count, src){
    const img = document.createElement('img');
    img.alt = type;
    img.title = type;
    img.dataset.kind = 'role';   // the shared error listener falls back to the drawn symbol
    img.dataset.type = type;
    img.dataset.count = String(count);
    img.setAttribute('src', src);
    return img;
  }

  function roleBadge(type, count){
    if(!own(LOCAL_FILE, type) || localSrc.get(type) === false) return pill(type, count);
    const wrap = document.createElement('span');
    wrap.className = 'ko-badge ko-badge-art';
    const addCount = () => {
      if(count > 0 && type === 'sub_gifter'){
        const c = document.createElement('span');
        c.className = 'ko-count';
        c.textContent = String(count);
        wrap.appendChild(c);
      }
    };
    const known = localSrc.get(type);
    if(typeof known === 'string'){
      wrap.appendChild(badgeArt(type, count, known));
      addCount();
    } else {
      // Empty and invisible until the shared probe answers, then art or the drawn symbol.
      probeBadge(type).then(src => {
        if(typeof src === 'string'){ wrap.appendChild(badgeArt(type, count, src)); addCount(); }
        else wrap.replaceWith(pill(type, count));
      });
    }
    return wrap;
  }

  // Real channel badge for the highest tier <= months; drawn star if none fits or the image fails.
  function subscriberBadge(months){
    const tier = subBadges.find(b => months >= b.months);
    if(!tier || !BADGE_SRC_RE.test(tier.src)) return pill('subscriber', months);
    const wrap = document.createElement('span');
    wrap.className = 'ko-badge';
    wrap.dataset.months = String(months);
    const img = document.createElement('img');
    img.dataset.kind = 'subscriber';   // the shared error listener only handles these
    img.setAttribute('src', tier.src);
    img.setAttribute('alt', 'subscriber');
    img.setAttribute('title', months > 0 ? 'Sub · ' + months + 'm' : 'Sub');
    wrap.appendChild(img);
    return wrap;
  }

  function renderBadges(list){
    const wrap = document.createElement('span');
    wrap.className = 'ko-badges';
    let any = false;
    let bcastShown = false;
    for(const b of (Array.isArray(list) ? list : [])){
      const type = String((b && b.type) || '').toLowerCase();
      const n = countOf(b);
      if(BROADCASTER.has(type)){
        if(bcastShown) continue;
        bcastShown = true;
        const s = document.createElement('span');
        s.className = 'ko-bcast';
        s.textContent = BCAST_LABEL;
        wrap.appendChild(s);
      } else if(type === 'subscriber'){
        wrap.appendChild(subscriberBadge(n));
      } else if(own(ICON, type)){
        wrap.appendChild(roleBadge(type, n));
      } else if(b && b.text){
        const t = document.createElement('span');
        t.className = 'ko-badge';
        t.style.backgroundColor = '#4b5563';
        t.style.fontSize = '10px';
        t.style.fontWeight = '700';
        t.textContent = String(b.text);
        wrap.appendChild(t);
      } else {
        continue;
      }
      any = true;
    }
    return any ? wrap : null;
  }

  // Emotes become <img>, everything else stays text. Nothing is parsed as markup.
  // Past EMOTE_MAX emotes per message the rest show as their names, so one message cannot load dozens of images.
  function appendBody(parent, raw){
    let last = 0, emotes = 0;
    for(const m of raw.matchAll(EMOTE_RE)){
      if(m.index > last) parent.appendChild(document.createTextNode(raw.slice(last, m.index)));
      if(emotes++ < EMOTE_MAX){
        const img = document.createElement('img');
        img.className = 'ko-emote';
        img.setAttribute('src', 'https://files.kick.com/emotes/' + m[1] + '/fullsize');
        img.setAttribute('alt', m[2]);
        img.setAttribute('title', m[2]);
        parent.appendChild(img);
      } else {
        parent.appendChild(document.createTextNode(m[2]));
      }
      last = m.index + m[0].length;
    }
    if(last < raw.length) parent.appendChild(document.createTextNode(raw.slice(last)));
  }

  // One capture listener on the feed handles every image error, so no per-image listeners exist to leak.
  feed.addEventListener('error', function(e){
    const img = e.target;
    if(!(img instanceof HTMLImageElement)) return;
    if(img.classList.contains('ko-emote')){ img.replaceWith(document.createTextNode(img.alt)); return; }
    const wrap = img.parentElement;
    if(!wrap || !wrap.classList.contains('ko-badge')) return;
    if(img.dataset.kind === 'subscriber') wrap.replaceWith(pill('subscriber', Number(wrap.dataset.months) || 0));
    else if(img.dataset.kind === 'role') wrap.replaceWith(pill(img.dataset.type, Number(img.dataset.count) || 0));
  }, true);

  // Moving the rest of the feed is a transform animation, so a message that is added or removed slides its
  // neighbours instead of snapping them. Off for animasyon=off and prefers-reduced-motion.
  function flipOn(){
    return S.animasyon !== 'off' && !(reduceMq && reduceMq.matches) && typeof Element.prototype.animate === 'function';
  }

  // Every row below the change moves by a distance known from the new/removed rows' own heights, so nothing is
  // measured before the DOM changes. Changes queue up and one flush per frame does all reads, then all writes.
  // The slide is additive: a running slide is never cancelled or read, a new one just stacks on it.
  const HAS_TRANSLATE = !!(window.CSS && CSS.supports && CSS.supports('translate', '0 1px'));
  const addedQ = [];     // appended rows waiting for their slide
  const removedQ = [];   // rows to take out of the feed in the next flush
  let flushRaf = 0, flushTimer = 0;
  let rowGap = -1;

  function queueFlush(){
    if(flushRaf || flushTimer) return;
    // rAF runs before the frame is painted, so the slide exists before the shifted rows are ever shown.
    // The timer covers a page whose rAF is paused (hidden tab), so a removal is never left pending.
    flushRaf = requestAnimationFrame(flush);
    flushTimer = setTimeout(flush, 120);
  }

  function flush(){
    cancelAnimationFrame(flushRaf);
    clearTimeout(flushTimer);
    flushRaf = flushTimer = 0;
    const added = new Set(addedQ.filter(el => el.isConnected));
    const gone = removedQ.filter(el => el.isConnected);
    addedQ.length = 0;
    removedQ.length = 0;
    if(!added.size && !gone.length) return;
    if(!flipOn()){ gone.forEach(el => el.remove()); return; }

    // ---- reads: the layout is clean from here until the first write ----
    if(rowGap < 0) rowGap = parseFloat(window.getComputedStyle(feed).rowGap) || 0;
    const feedTop = feed.getBoundingClientRect().top;
    let up = 0;                      // total height the added rows put under the old ones
    added.forEach(el => { up += el.offsetHeight + rowGap; });
    const goneSet = new Set(gone);
    const drop = new Map();          // removed row -> the height it frees
    let down = 0;
    gone.forEach(el => { const d = el.offsetHeight + rowGap; drop.set(el, d); down += d; });
    const reach = Math.max(up, down);
    const jobs = [];
    let freed = 0;                   // freed height of removed rows below the current row
    const rows = feed.children;
    for(let i = rows.length - 1; i >= 0; i--){
      const el = rows[i];
      if(added.has(el)) continue;
      if(goneSet.has(el)){ freed += drop.get(el); continue; }
      const d = up - freed;
      // Only rows that can be seen while they move are animated; the rest are above the mask.
      if(el.getBoundingClientRect().bottom + reach < feedTop) break;
      if(Math.abs(d) >= 0.5) jobs.push([el, d]);
    }

    // ---- writes ----
    gone.forEach(el => el.remove());
    const ms = S.animasyon === 'low' ? 200 : 300;
    for(const [el, d] of jobs){
      el.animate(HAS_TRANSLATE
        ? [{ translate: '0 ' + d + 'px' }, { translate: '0 0' }]
        : [{ transform: 'translateY(' + d + 'px)' }, { transform: 'translateY(0)' }],
      { duration: ms, easing: FLIP_EASE, composite: 'add' });
    }
  }

  // Appends rows now (the DOM stays in step with the events); the slide of the rows above follows in the flush.
  function appendRow(el){
    feed.appendChild(el);
    if(flipOn()){ addedQ.push(el); queueFlush(); }
  }

  const animCache = new Map();   // class -> animation length, read once; the motion setting does not change mid-page
  if(reduceMq && reduceMq.addEventListener) reduceMq.addEventListener('change', () => animCache.clear());

  // The element's own animation length, so the timer follows themes.css and the motion setting.
  function animMs(el, cls, fallback){
    if(animCache.has(cls)) return animCache.get(cls);
    const parts = (window.getComputedStyle(el).animationDuration || '').split(',')
      .map(x => parseFloat(x) * (/ms\s*$/.test(x) ? 1 : 1000));
    const ms = Math.max.apply(null, parts);
    const val = Number.isFinite(ms) && ms > 0 ? ms : fallback;
    animCache.set(cls, val);
    return val;
  }

  // The message plays its leave/fade animation, then goes and the feed closes the gap smoothly.
  function dismiss(el, cls, fallback){
    el.classList.add(cls);
    const wait = S.animasyon === 'off' ? 0 : animMs(el, cls, fallback);
    setTimeout(() => {
      if(!el.isConnected) return;
      if(!flipOn()){ el.remove(); return; }
      removedQ.push(el);
      queueFlush();
    }, wait);
  }

  // Messages of a banned user fade out before they are removed.
  function fadeRemove(el){
    if(!el || el.classList.contains('is-leaving') || el.classList.contains('is-fading')) return;
    dismiss(el, 'is-leaving', LEAVE_MS);
  }

  // Keeps the feed at MAX live messages before a new one is added. The oldest fades out in place under
  // the top mask; messages that are already leaving do not count against the limit.
  function makeRoom(){
    const live = Array.from(feed.querySelectorAll('.ko-msg:not(.is-leaving):not(.is-fading)'));
    while(live.length >= MAX) fadeRemove(live.shift());
  }

  // An id is the only safe dedupe key. Without one, name + text + send time (ms) stands in;
  // with no timestamp either, identical messages cannot be told apart from repeats, so none are dropped.
  function dedupeKey(ev, id, username){
    if(id) return id;
    const ms = K.parse.time(String(ev.createdAt || ''));
    return ms === null ? '' : [username, ev.message, ms].join('|');
  }

  function hidden(ev, username){
    if(HIDDEN_USERS.has(username.toLowerCase())) return true;
    return S.sohbetKomutGizle && String(ev.message || '').trimStart().startsWith('!');
  }

  // The first message would otherwise be laid out in the fallback font and relaid out when the web font arrives,
  // one long frame in front of the viewers. Messages wait (at most FONT_WAIT_MS) until the faces they use are in.
  const FONT_WAIT_MS = 1500;
  const heldEvents = [];
  let fontsReady = !(document.fonts && document.fonts.load && fontLink);
  if(!fontsReady){
    const family = (window.getComputedStyle(document.body).fontFamily.split(',')[0] || '').trim();
    const release = () => {
      if(fontsReady) return;
      fontsReady = true;
      clearTimeout(fontTimer);
      warmUp();
      heldEvents.splice(0).forEach(addMessage);
    };
    const fontTimer = setTimeout(release, FONT_WAIT_MS);
    const loadFaces = () => Promise.all(['400 18px ', '700 16px ', '800 11px '].map(w => document.fonts.load(w + family, 'Aa Çğİşöü'))).then(release, release);
    if(fontLink.sheet) loadFaces();
    else { fontLink.addEventListener('load', loadFaces); fontLink.addEventListener('error', release); }
  }

  // Shapes the three text styles once, off screen, so the first real message does not pay for font decoding
  // and fallback lookup inside an animation frame.
  function warmUp(){
    const box = document.createElement('div');
    box.className = 'ko-msg';
    box.setAttribute('aria-hidden', 'true');
    box.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;animation:none';
    box.innerHTML = '<span class="ko-user">Aa Çğİşöü</span><span class="ko-text"> Aa Çğİşöü 👋</span><span class="ko-badge"><span class="ko-count">12</span></span>';
    document.body.appendChild(box);
    box.offsetWidth;
    box.remove();
  }

  function addMessage(ev){
    if(!fontsReady){ heldEvents.push(ev); return; }
    const id = ev.id != null && ev.id !== '' ? String(ev.id) : '';
    const username = String(ev.username || '?');
    if(hidden(ev, username)) return;
    const key = dedupeKey(ev, id, username);
    if(key){
      if(seen.has(key)) return;
      seen.add(key);
      if(seen.size > SEEN_CAP) seen.delete(seen.values().next().value);
    }

    const el = document.createElement('div');
    el.className = 'ko-msg';
    el.dataset.at = String(Date.now());
    if(id) el.dataset.id = id;
    if(ev.senderId) el.dataset.uid = String(ev.senderId);
    el.dataset.uname = username.toLowerCase();

    const badges = renderBadges(ev.badges);
    if(badges) el.appendChild(badges);

    const user = document.createElement('span');
    user.className = 'ko-user';
    user.textContent = username;
    const color = String(ev.color || '').trim();
    if(HEX_RE.test(color)) user.style.setProperty('--name-color', color);
    el.appendChild(user);

    const text = document.createElement('span');
    text.className = 'ko-text';
    text.appendChild(document.createTextNode(' '));
    appendBody(text, String(ev.message || ''));
    el.appendChild(text);

    makeRoom();
    appendRow(el);
    msgTotal += 1;
    K.debug({ messages: msgTotal });
  }

  // sohbetSilinmeSn: fades a message once it is that old. One sweep a second is precise enough and holds no per-message timers.
  function sweep(){
    const limit = S.sohbetSilinmeSn * 1000, now = Date.now();
    feed.querySelectorAll('.ko-msg:not(.is-leaving):not(.is-fading)').forEach(el => {
      if(now - Number(el.dataset.at) < limit) return;
      dismiss(el, 'is-fading', FADE_MS);
    });
  }

  function removeMessagesByUser(userId, username){
    const uname = String(username || '').toLowerCase();
    feed.querySelectorAll('.ko-msg:not(.is-leaving)').forEach(el => {
      const match = userId ? el.dataset.uid === String(userId) : (!!uname && el.dataset.uname === uname);
      if(!match) return;
      if(el.dataset.id) seen.delete(el.dataset.id);
      fadeRemove(el);
    });
  }

  function onEvent(ev){
    if(!ev) return;
    switch(ev.kind){
      case 'chat':   if(ev.message) addMessage(ev); break;
      case 'ban':    removeMessagesByUser(ev.userId, ev.username); break;
    }
  }

  // The relay (relay/server.js) sends chat and ban events already in this shape.
  // The core reconnects by itself; the note only appears if the relay stays away for RELAY_DOWN_MS.
  function onStatus(st){
    K.debug({ relay: st });
    if(st === 'open'){
      if(downTimer !== null){ clearTimeout(downTimer); downTimer = null; }
      K.note(noteEl, S, '');
    } else if(downTimer === null){
      downTimer = setTimeout(() => { downTimer = null; K.note(noteEl, S, T.relayDown); }, RELAY_DOWN_MS);
    }
  }

  // Chat comes from the local relay. Subscriber badge images come from Kick's public channel data.
  function startLive(){
    K.kick.channel(S.kanal, S).then((ch) => {
      if(ch.ok && !closing){
        subBadges = K.parse.subBadges(ch.data);
        K.debug({ 'badge src': ch.src, 'sub badges': subBadges.length });
      }
    }).catch(() => {});
    stopChat = K.connectRelay(S.relayAdresi + '/events', { onMessage: onEvent, onStatus: onStatus });
  }

  // Sample messages, used when kanal is empty and in preview. Makes no network calls.
  const SAMPLES = [
    { username:'StreamerName', color:'#53fc18', message:'Hey chat! 👋 / Selam!', badges:[{type:'broadcaster'}] },
    { username:'Mia', color:'#7bdcff', message:'This overlay looks clean', badges:[{type:'vip'}] },
    { username:'Luna', color:'#ff8bd1', message:'Audio is crystal clear', badges:[] },
    { username:'Kenji', color:'#ffd166', message:'GG! ranked when?', badges:[{type:'subscriber', count:3}] },
    { username:'Alex', color:'#a78bfa', message:'thanks for the gifts', badges:[{type:'og'}, {type:'sub_gifter', count:5}] }
  ];
  function startPreview(withHint){
    if(withHint){
      const hint = document.createElement('div');
      hint.className = 'ko-hint';
      hint.textContent = T.hint;
      document.body.appendChild(hint);
    }
    let i = 0;
    const tick = () => {
      addMessage(Object.assign({}, SAMPLES[i % SAMPLES.length], { id: 'demo-' + i }));
      i++;
    };
    tick();
    previewTimer = setInterval(tick, 2500);
  }

  window.addEventListener('pagehide', function(){
    closing = true;
    if(previewTimer !== null) clearInterval(previewTimer);
    if(fadeTimer !== null) clearInterval(fadeTimer);
    if(downTimer !== null) clearTimeout(downTimer);
    if(stopChat) stopChat();
  });

  if(S.sohbetSilinmeSn > 0) fadeTimer = setInterval(sweep, 1000);

  // Preview (?onizleme=1) never connects and never shows the setup hint.
  // The hint only appears when there is no channel and this is not a preview.
  if(PREVIEW || !S.kanal) startPreview(!S.kanal && !PREVIEW);
  else startLive();
})();
</script>

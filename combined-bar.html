<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Combined Bar</title>
<!-- OBS Browser source (Local file): 520 x 180. Follower and subscriber goals in one panel. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.local.js"></script>
<script src="AYARLAR.relay.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px;
    font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .ko-stack { position: relative; width: 100%; max-width: 488px; display: flex; flex-direction: column;
    gap: 14px; border-radius: var(--r-card); }
  .ko-chip[hidden], .ko-hint[hidden] { display: none; }
</style>
</head>
<body>
<div class="ko-stack">
  <div class="ko-bar" id="followRow">
    <div class="ko-fill" data-fill></div>
    <div class="ko-row">
      <span class="ko-cur"><span data-val>0</span><span class="ko-chip" data-pct hidden></span></span>
      <span class="ko-label"><span data-lbl></span></span>
      <span class="ko-goal" data-goal>0</span>
    </div>
  </div>
  <div class="ko-bar" id="subRow">
    <div class="ko-fill" data-fill></div>
    <div class="ko-row">
      <span class="ko-cur"><span data-val>0</span><span class="ko-chip" data-delta hidden></span><span class="ko-chip" data-pct hidden></span></span>
      <span class="ko-label"><span data-lbl></span></span>
      <span class="ko-goal" data-goal>0</span>
    </div>
  </div>
  <div class="ko-hint" id="hint" hidden></div>
</div>
<div class="ko-note is-hidden" id="note" aria-live="polite"></div>
<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const PREVIEW = K.isPreview();
  K.applyLook(S);
  K.loadFont(S);
  const T = K.text(S);

  const $ = (id) => document.getElementById(id);
  const note = $('note'), hint = $('hint');
  const INTERVAL = S.yenilemeSn * 1000;
  // Poll statuses that are a normal answer; anything else backs the subscriber poller off.
  const FINE = { ok: 1, manual: 1, 'no-data': 1, 'no-channel': 1 };

  function makeRow(root, goal, label) {
    const q = (sel) => root.querySelector(sel);
    q('[data-goal]').textContent = K.fmt(goal);
    q('[data-lbl]').textContent = label;
    const del = q('[data-delta]');
    return K.createGoalBar({ bar: root, fill: q('[data-fill]'), val: q('[data-val]'), pct: q('[data-pct]'), delta: del }, goal, S);
  }

  const followRow = makeRow($('followRow'), S.takipciHedefi, K.label(S, 'Takipçi', 'Follower'));
  const subRow = makeRow($('subRow'), S.aboneHedefi, K.label(S, 'Abone', 'Subscriber'));

  // Both rows share one note; each source keeps its own message.
  const msgs = { followers: '', subs: '' };
  function setNote(which, text) {
    msgs[which] = text;
    K.note(note, S, [msgs.followers, msgs.subs].filter(Boolean).join(' · '));
  }

  // total is null until the first real value; the note then says Kick could not be reached, not "last value".
  function subsNote(r) {
    switch (r.status) {
      case 'auth': return T.auth;
      case 'rate': return T.rate;
      case 'error': return r.total === null ? T.unreachable : T.error;
      case 'no-data':
      case 'no-credentials': return T.noData;
      default: return '';
    }
  }

  function showSubs(r) {
    subRow.set(r.total === null ? 0 : r.total, r.delta);
    setNote('subs', subsNote(r));
  }

  // Preview (?onizleme=1): sample values for both rows, no source and no timer.
  if (PREVIEW) {
    followRow.set(K.sample.followers);
    showSubs({ total: K.sample.subs, delta: K.sample.delta, status: 'manual' });
    K.debug({ mode: 'preview' });
    return;
  }

  if (!S.kanal) {
    hint.textContent = T.hint;
    hint.hidden = false;
  }

  // ---- followers: public Kick endpoint (via the relay when it runs), no token ----
  let lastFollowers = null;
  async function pollFollowers() {
    const res = await K.kick.channel(S.kanal, S);
    const n = res.ok ? K.parse.followers(res.data) : null;
    if (n !== null) {
      lastFollowers = n;
      followRow.set(n);
      setNote('followers', '');
    } else {
      // Fallback count only with a note saying so; later failures keep the last good value.
      if (lastFollowers === null) followRow.set(S.takipciYedek);
      setNote('followers', lastFollowers === null ? T.unreachable : res.status === 429 ? T.rate : T.error);
    }
    K.debug({
      'followers src': res.src || '-',
      followers: n !== null ? 'ok' : (res.status || res.error || 'error'),
      'last poll': new Date().toLocaleTimeString()
    });
    return { ok: n !== null, retryAfterMs: res.retryAfterMs };
  }

  // ---- subscribers: the source decides relay, token or manual ----
  const src = K.createSubscriberSource(S);
  async function pollSubs() {
    const r = await src.poll();
    showSubs(r);
    K.debug({ 'subs src': r.mode, 'subs': r.status });
    return { ok: !!FINE[r.status], retryAfterMs: r.retryAfterMs };
  }

  // Without a channel nothing is requested: the fallback follower count and a manual sub count show once.
  if (!S.kanal) {
    followRow.set(S.takipciYedek);
    pollSubs();
    return;
  }

  const pollers = [
    K.poller(pollFollowers, { intervalMs: INTERVAL }),
    K.poller(pollSubs, { intervalMs: INTERVAL })
  ];
  pollers.forEach((p) => p.start());
  let debugTimer = null;
  if (K.isDebug()) {
    debugTimer = setInterval(function () {
      const secs = (p) => { const ms = p.nextInMs(); return ms === null ? '-' : Math.ceil(ms / 1000) + 's'; };
      K.debug({ 'next poll': secs(pollers[0]) + ' / ' + secs(pollers[1]) });
    }, 1000);
  }
  window.addEventListener('pagehide', function () {
    pollers.forEach((p) => p.stop());
    followRow.destroy();
    subRow.destroy();
    if (debugTimer !== null) clearInterval(debugTimer);
  });
})();
</script>
</body>
</html>

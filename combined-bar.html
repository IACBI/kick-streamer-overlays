<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Combined Bar</title>
<!-- OBS Browser source (Local file): 520 x 180. Follower and subscriber goals in one panel. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.local.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px;
    font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .ko-stack { position: relative; width: 100%; max-width: 488px; display: flex; flex-direction: column;
    gap: 14px; border-radius: var(--r-card); }
  .ko-chip[hidden], .ko-hint[hidden] { display: none; }
</style>
</head>
<body>
<div class="ko-stack">
  <div class="ko-bar" id="followRow">
    <div class="ko-fill" data-fill></div>
    <div class="ko-row">
      <span class="ko-cur"><span data-val>0</span><span class="ko-chip" data-pct hidden></span></span>
      <span class="ko-label"><span data-lbl></span></span>
      <span class="ko-goal" data-goal>0</span>
    </div>
  </div>
  <div class="ko-bar" id="subRow">
    <div class="ko-fill" data-fill></div>
    <div class="ko-row">
      <span class="ko-cur"><span data-val>0</span><span class="ko-chip" data-delta hidden></span><span class="ko-chip" data-pct hidden></span></span>
      <span class="ko-label"><span data-lbl></span></span>
      <span class="ko-goal" data-goal>0</span>
    </div>
  </div>
  <div class="ko-hint" id="hint" hidden></div>
</div>
<div class="ko-note is-hidden" id="note"></div>
<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const PREVIEW = K.isPreview();
  K.applyLook(S);

  const $ = (id) => document.getElementById(id);
  const note = $('note'), hint = $('hint');
  const TICK = S.yenilemeSn * 1000;
  const NOTES = {
    auth: K.label(S, 'Kick uygulama bilgisi hatalı', 'Kick app credentials rejected') + ' — AYARLAR.local.js',
    rate: K.label(S, "Kick'e ulaşılamadı, son değer gösteriliyor", 'Kick unreachable, showing the last value'),
    error: K.label(S, "Kick'e ulaşılamadı, son değer gösteriliyor", 'Kick unreachable, showing the last value'),
    'no-data': K.label(S, 'Kick bu kanal için abone verisi döndürmedi', 'Kick returned no subscriber data for this channel')
  };

  function makeRow(root, goal) {
    const q = (sel) => root.querySelector(sel);
    q('[data-goal]').textContent = K.fmt(goal);
    return {
      root: root, goal: goal, shown: 0, cancel: null, lastTotal: null,
      fill: q('[data-fill]'), val: q('[data-val]'), pct: q('[data-pct]'),
      delta: q('[data-delta]'), lbl: q('[data-lbl]')
    };
  }

  const followRow = makeRow($('followRow'), S.takipciHedefi);
  const subRow = makeRow($('subRow'), S.aboneHedefi);
  followRow.lbl.textContent = K.label(S, 'Takipçi', 'Follower');
  subRow.lbl.textContent = K.label(S, 'Abone', 'Subscriber');

  function setValue(r, total) {
    r.fill.style.width = K.pct(total, r.goal) + '%';
    if (r.cancel) r.cancel();
    r.cancel = K.tween(r.shown, total, S.animasyon === 'off' ? 0 : 1300, function (v) {
      r.shown = v;
      r.val.textContent = K.fmt(v);
    });
    r.pct.hidden = !S.yuzdeGoster;
    if (S.yuzdeGoster) r.pct.textContent = Math.round(K.pct(total, r.goal)) + '%';
  }

  function bump(r) {
    r.root.classList.remove('ko-bump');
    void r.root.offsetWidth;
    r.root.classList.add('ko-bump');
  }

  function showSubs(r) {
    const total = r.total === null ? 0 : r.total;
    setValue(subRow, total);
    if (subRow.lastTotal !== null && total > subRow.lastTotal) bump(subRow);
    subRow.lastTotal = total;

    const showDelta = S.oturumFarkiGoster && r.delta !== 0;
    subRow.delta.hidden = !showDelta;
    if (showDelta) {
      subRow.delta.textContent = (r.delta > 0 ? '+' : '-') + K.fmt(Math.abs(r.delta));
      subRow.delta.classList.toggle('is-neg', r.delta < 0);
    }

    const text = NOTES[r.status] || '';
    note.textContent = text;
    note.classList.toggle('is-hidden', !text);
  }

  // Preview (?onizleme=1): sample values for both rows, no source and no timer.
  if (PREVIEW) {
    setValue(followRow, K.sample.followers);
    showSubs({ total: K.sample.subs, delta: K.sample.delta, status: 'manual' });
    return;
  }

  if (!S.kanal) {
    hint.textContent = '⚙ AYARLAR.js → kanal / set your channel';
    hint.hidden = false;
  }

  // ---- followers: public Kick endpoint, no token ----
  let lastFollowers = null, fBusy = false;
  async function pollFollowers() {
    if (fBusy) return;
    fBusy = true;
    try {
      const res = await K.kick.channel(S.kanal);
      const n = res.ok ? K.parse.followers(res.data) : null;
      if (n !== null) lastFollowers = n;
      setValue(followRow, lastFollowers !== null ? lastFollowers : S.takipciYedek);
    } finally { fBusy = false; }
  }

  // ---- subscribers: source decides token vs manual ----
  const src = K.createSubscriberSource(S);
  let sBusy = false;

  async function pollSubs() {
    if (sBusy) return;
    sBusy = true;
    try { showSubs(await src.poll()); } finally { sBusy = false; }
  }

  // One interval drives both sources.
  function refresh() {
    pollFollowers();
    if (src.mode === 'token') pollSubs();
  }

  let timer = null;
  if (S.kanal) {
    refresh();
    timer = setInterval(refresh, TICK);
    if (src.mode === 'manual') pollSubs();
  } else {
    setValue(followRow, S.takipciYedek);
    pollSubs();
  }
  window.addEventListener('pagehide', function () {
    if (timer !== null) clearInterval(timer);
    if (followRow.cancel) followRow.cancel();
    if (subRow.cancel) subRow.cancel();
  });
})();
</script>
</body>
</html>

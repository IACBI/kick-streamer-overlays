<!DOCTYPE html>
<!-- OBS Browser source (Local file): 640 x 200. Follow, subscription, gift and Kicks alerts. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Alerts Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.relay.js"></script>
<script src="shared/lang/tr.js"></script>
<script src="shared/lang/en.js"></script>
<script src="shared/lang/es.js"></script>
<script src="shared/lang/pt.js"></script>
<script src="shared/lang/de.js"></script>
<script src="shared/lang/ar.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body { position: relative; font-family: var(--font); -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div class="ko-alert-stage" id="stage" role="status" aria-live="polite"></div>
<div class="ko-note is-hidden" id="note" aria-live="polite"></div>

<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const PREVIEW = K.isPreview();
  K.applyLook(S);
  K.loadFont(S);

  const stage = document.getElementById('stage');
  const noteEl = document.getElementById('note');
  const DWELL_MS = S.uyariSn * 1000;
  // A raid of follows must not hold the screen for minutes: past QUEUE_MAX the oldest follow is dropped first,
  // and while more than BACKLOG alerts wait, each one stays half as long (never under MIN_DWELL_MS).
  const QUEUE_MAX = 25;
  const BACKLOG = 5;
  const MIN_DWELL_MS = 3000;
  const GAP_MS = 250;
  const OUT_FALLBACK_MS = 350;   // .ko-alert.is-out in themes.css, used when the computed length is unreadable
  const RELAY_DOWN_MS = 5000;
  const SEEN_CAP = 500;
  const ENABLED = { follow: S.uyariTakip, sub: S.uyariAbone, gift: S.uyariHediye, kicks: S.uyariKicks, reward: S.uyariOdul };
  const queue = [];
  const seen = new Set();
  let current = null;       // the alert element on screen
  let dwellTimer = null, outTimer = null, previewTimer = null, downTimer = null;
  let stopRelay = null;
  let shown = 0, dropped = 0;
  let paused = false;        // set from the OBS dock: alerts keep queueing but none starts
  // Preview and sample mode stay silent, so opening the studio or a test page never makes noise.
  const SILENT = PREVIEW || !S.kanal;
  const media = K.createAlertMedia(SILENT ? Object.assign({}, S, { uyariSes: false }) : S,
    Object.keys(ENABLED).filter(k => ENABLED[k]));
  // Speech goes to the computer's default output, not through the OBS source (see README), and only when the
  // browser has a voice. It never runs in previews or sample mode.
  const synth = !SILENT && S.uyariTts && window.speechSynthesis && window.SpeechSynthesisUtterance ? window.speechSynthesis : null;
  const TTS_MS_PER_CHAR = 75;
  const TTS_MAX_MS = 30000;

  // Starts reading the alert's message and returns how long the card should stay for it (0 when nothing is read).
  function speak(ev){
    const text = synth ? K.ttsText(S, ev) : '';
    if (!text) return 0;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = K.speechLang(S);
      const voice = synth.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(u.lang.slice(0, 2)));
      if (voice) u.voice = voice;
      u.volume = Math.max(0, Math.min(1, S.uyariSesSeviye / 100));
      synth.cancel();
      synth.speak(u);
    } catch (e) { return 0; }
    return Math.min(TTS_MAX_MS, 1500 + text.length * TTS_MS_PER_CHAR);
  }

  // Title, name and detail per kind. Everything is set as text; nothing from an event is parsed as markup.
  function content(ev){
    const n = K.fmt;
    switch (ev.kind) {
      case 'follow':
        return { title: K.t(S, 'alert.follow'), name: ev.username, detail: '' };
      case 'sub':
        if (ev.renewal) return { title: K.t(S, 'alert.resub'), name: ev.username,
          detail: K.t(S, 'alert.month', { n: ev.months }) };
        return { title: K.t(S, 'alert.sub'), name: ev.username,
          detail: ev.months > 1 ? K.t(S, 'alert.months', { n: ev.months }) : '' };
      case 'gift':
        return { title: K.t(S, 'alert.gift'),
          name: ev.anonymous ? K.t(S, 'name.anonymous') : ev.username,
          detail: K.t(S, 'event.gifted', { n: ev.count }) };
      case 'kicks':
        return { title: K.t(S, 'alert.kicks'), name: ev.username,
          detail: K.t(S, 'event.kicks', { n: ev.amount }) + (ev.giftName ? ' · ' + ev.giftName : ''), message: ev.message || '' };
      case 'reward':
        return { title: K.t(S, 'alert.reward'), name: ev.username,
          detail: ev.rewardTitle + (ev.cost ? ' · ' + n(ev.cost) + ' ' + K.t(S, 'alert.points') : ''), message: ev.message || '' };
    }
    return null;
  }

  // A file in alerts/ (see alerts/OKU-README.txt) takes the icon's place; video plays muted, the sound is separate.
  function art(kind){
    const a = media.art(kind);
    if (!a) return null;
    const m = document.createElement(a.video ? 'video' : 'img');
    m.className = 'ko-alert-media';
    m.setAttribute('aria-hidden', 'true');
    if (a.video) { m.muted = true; m.loop = true; m.autoplay = true; m.playsInline = true; }
    else m.alt = '';
    m.src = a.src;
    return m;
  }

  function build(ev){
    const c = content(ev);
    const el = document.createElement('div');
    el.className = 'ko-alert is-' + ev.kind;
    let ic = art(ev.kind);
    if (ic) el.classList.add('has-media');
    else {
      ic = document.createElement('span');
      ic.className = 'ko-alert-icon';
      ic.appendChild(K.alertIcon(ev.kind));
    }
    const body = document.createElement('div');
    body.className = 'ko-alert-body';
    const title = document.createElement('div');
    title.className = 'ko-alert-title';
    title.textContent = c.title;
    const name = document.createElement('div');
    name.className = 'ko-alert-name';
    name.textContent = c.name;
    body.append(title, name);
    if (c.detail) {
      const d = document.createElement('div');
      d.className = 'ko-alert-detail';
      d.textContent = c.detail;
      body.appendChild(d);
    }
    if (c.message) {
      const m = document.createElement('div');
      m.className = 'ko-alert-msg';
      m.textContent = '“' + c.message + '”';
      body.appendChild(m);
    }
    el.append(ic, body);
    return el;
  }

  // Shape check for what reaches the page, so a malformed frame can never throw inside the queue.
  function valid(ev){
    if (!ev || !Object.hasOwn(ENABLED, ev.kind) || !ENABLED[ev.kind]) return false;
    if (ev.kind === 'reward' && K.rewardHidden(S, ev.title)) return false;
    if (ev.kind === 'gift') return ev.anonymous === true || (typeof ev.username === 'string' && ev.username !== '');
    return typeof ev.username === 'string' && ev.username !== '';
  }

  function enqueue(raw){
    if (!valid(raw)) return;
    const ev = {
      kind: raw.kind, id: raw.id != null ? String(raw.id) : '',
      username: String(raw.username || '').slice(0, 60),
      anonymous: raw.anonymous === true, renewal: raw.renewal === true,
      months: Math.max(1, Math.trunc(Number(raw.months)) || 1),
      count: Math.max(1, Math.trunc(Number(raw.count)) || 1),
      amount: Math.max(0, Math.trunc(Number(raw.amount)) || 0),
      giftName: String(raw.giftName || '').slice(0, 40),
      rewardTitle: String(raw.title || '').slice(0, 60),
      cost: Math.max(0, Math.trunc(Number(raw.cost)) || 0),
      message: String(raw.message || '').slice(0, 200)
    };
    if (ev.id) {
      if (seen.has(ev.id)) return;
      seen.add(ev.id);
      if (seen.size > SEEN_CAP) seen.delete(seen.values().next().value);
    }
    if (queue.length >= QUEUE_MAX) {
      const f = queue.findIndex(q => q.kind === 'follow');
      queue.splice(f >= 0 ? f : 0, 1);
      dropped += 1;
    }
    queue.push(ev);
    K.debug({ queued: queue.length, dropped: dropped });
    if (!current && outTimer === null) showNext();
  }

  function motionOff(){ return S.animasyon === 'off'; }

  function outMs(el){
    if (motionOff()) return 0;
    const parts = (window.getComputedStyle(el).animationDuration || '').split(',')
      .map(x => parseFloat(x) * (/ms\s*$/.test(x) ? 1 : 1000));
    const ms = Math.max.apply(null, parts);
    return Number.isFinite(ms) && ms > 0 ? ms : OUT_FALLBACK_MS;
  }

  function showNext(){
    if (paused) { K.debug({ paused: true, queued: queue.length }); return; }
    const ev = queue.shift();
    if (!ev) { K.debug({ queued: 0 }); return; }
    current = build(ev);
    stage.appendChild(current);
    shown += 1;
    const sound = SILENT ? 'off' : media.play(ev.kind);
    const speechMs = speak(ev);
    K.debug({ shown: shown, queued: queue.length, last: ev.kind, sound: sound, speech: speechMs ? speechMs + ' ms' : 'off' });
    // A card being read stays until the reading is likely done, even with a backlog.
    const dwell = Math.max(speechMs, queue.length >= BACKLOG ? Math.max(MIN_DWELL_MS, DWELL_MS / 2) : DWELL_MS);
    dwellTimer = setTimeout(leave, dwell);
  }

  function leave(){
    dwellTimer = null;
    const el = current;
    current = null;
    if (!el) return;
    el.classList.add('is-out');
    outTimer = setTimeout(() => {
      outTimer = null;
      el.remove();
      setTimeout(() => { if (!current && outTimer === null) showNext(); }, motionOff() ? 0 : GAP_MS);
    }, outMs(el));
  }

  // Buttons of the OBS dock (dock.html), sent by the relay to every alerts page.
  function control(action){
    if (action === 'pause') paused = true;
    else if (action === 'resume') {
      paused = false;
      K.debug({ paused: null });
      if (!current && outTimer === null) showNext();
    } else if (action === 'skip' && current) {
      if (synth) synth.cancel();
      if (dwellTimer !== null) { clearTimeout(dwellTimer); dwellTimer = null; }
      leave();
    }
  }

  function onRelay(ev){
    if (ev.kind === 'control') control(ev.action);
    else enqueue(ev);
  }

  function onStatus(st){
    K.debug({ relay: st });
    if (st === 'blocked') { K.note(noteEl, S, K.relayBlockedNote(S)); return; }
    if (st === 'open') {
      if (downTimer !== null) { clearTimeout(downTimer); downTimer = null; }
      K.note(noteEl, S, '');
    } else if (downTimer === null) {
      downTimer = setTimeout(() => { downTimer = null; K.note(noteEl, S, K.t(S, 'note.alertRelay')); }, RELAY_DOWN_MS);
    }
  }

  // One of each kind, in turn; a sample kind the settings turn off is skipped like a live one.
  const SAMPLES = [
    { kind: 'follow', username: 'Mia' },
    { kind: 'sub', username: 'Kenji', months: 1, renewal: false },
    { kind: 'gift', username: 'Alex', count: 5 },
    { kind: 'kicks', username: 'Luna', amount: 500, giftName: 'Rage Quit', message: 'GG!' },
    { kind: 'sub', username: 'Sora', months: 6, renewal: true },
    { kind: 'reward', username: 'Rin', title: 'Pick the next game', cost: 500, message: 'Valorant!' }
  ];
  function startPreview(withHint){
    if (withHint) {
      const hint = document.createElement('div');
      hint.className = 'ko-hint';
      hint.textContent = K.text(S).hint;
      document.body.appendChild(hint);
    }
    let i = 0;
    const tick = () => {
      for (let n = 0; n < SAMPLES.length; n++) {
        const s = SAMPLES[(i + n) % SAMPLES.length];
        if (ENABLED[s.kind]) { enqueue(Object.assign({ id: 'demo-' + i }, s)); break; }
      }
      i += 1;
    };
    tick();
    previewTimer = setInterval(tick, DWELL_MS + 900);
  }

  window.addEventListener('pagehide', function(){
    [dwellTimer, outTimer, downTimer].forEach(t => { if (t !== null) clearTimeout(t); });
    if (previewTimer !== null) clearInterval(previewTimer);
    if (stopRelay) stopRelay();
    if (synth) synth.cancel();
  });

  // Alerts come only from the local relay, which receives Kick's signed webhooks (see relay/).
  if (PREVIEW || !S.kanal) startPreview(!S.kanal && !PREVIEW);
  else stopRelay = K.connectRelay(S.relayAdresi + '/events', { onMessage: onRelay, onStatus: onStatus });
})();
</script>
</body>
</html>

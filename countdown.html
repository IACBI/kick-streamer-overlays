<!DOCTYPE html>
<!-- OBS Browser source (Local file): 520 x 190. "Starting soon" countdown. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kick Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared/themes.css">
<script src="AYARLAR.js"></script>
<script src="AYARLAR.relay.js"></script>
<script src="shared/kick-core.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    box-sizing: border-box; padding: 16px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font); -webkit-font-smoothing: antialiased;
  }
  .ko-panel.cd {
    width: 100%; flex-direction: column; gap: 10px; padding: 18px 28px 20px; text-align: center;
    border-radius: min(var(--r-card), 36px);
    transition: opacity var(--ko-dur-in, .5s) ease, transform var(--ko-dur-in, .5s) ease,
      border-color var(--ko-dur-in, .5s) ease, box-shadow var(--ko-dur-in, .5s) ease;
  }
  .cd-title {
    font-size: 16px; font-weight: 700; color: var(--muted); letter-spacing: .3px; text-shadow: var(--text-shadow);
    transition: opacity .2s ease, color var(--ko-dur-in, .5s) ease;
  }
  .cd-title.is-swap { opacity: 0; }
  .cd-time {
    font-size: 64px; font-weight: 800; line-height: 1; color: var(--text); text-shadow: var(--text-shadow);
    font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; letter-spacing: 1px;
  }
  .cd-track { width: 100%; height: 6px; border-radius: 999px; overflow: hidden; background: var(--track-bg); }
  /* The fill keeps its full width and slides in from the left, so its cap and pattern are never squeezed. */
  .cd-fill {
    width: 100%; height: 100%; border-radius: inherit; background: var(--fill-bg);
    transform: translateX(calc((var(--fill, 1) - 1) * 100%)); transition: transform 1s linear;
  }
  /* Done: the last step is a smooth refill instead of a per-second tick. */
  .cd.is-done .cd-fill { transition: transform var(--ko-dur-fill, 1.2s) var(--ko-ease-out, cubic-bezier(.22, 1, .36, 1)); }
  .cd.is-done { border-color: rgb(var(--accent-rgb) / 70%); box-shadow: var(--shadow), 0 0 18px rgb(var(--accent-rgb) / 45%); }
  .cd.is-done .cd-title { color: var(--text); font-weight: 800; }
  .cd.is-done .cd-time { animation: cd-pop 1.2s ease-in-out infinite; }
  @keyframes cd-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  /* Low, off and reduced motion set the fill at once: no slide at every tick. */
  body.motion-low .cd-fill, body.motion-off .cd-fill, body.motion-low .cd.is-done .cd-fill, body.motion-off .cd.is-done .cd-fill,
  body.motion-low .cd, body.motion-off .cd { transition: none; }
  body.motion-low .cd-title, body.motion-off .cd-title { transition: none; }
  body.motion-low .cd.is-done .cd-time { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .cd-fill, .cd.is-done .cd-fill, .cd, .cd-title { transition: none; }
    .cd.is-done .cd-time { animation: none; }
  }
</style>
</head>
<body>
<div class="ko-panel cd" id="panel" role="timer" aria-live="off">
  <div class="cd-title" id="title"></div>
  <div class="cd-time" id="time">00:00</div>
  <div class="cd-track"><div class="cd-fill" id="fill"></div></div>
</div>
<script>
(function(){
  const K = window.KickOverlay;
  const S = K.readSettings();
  const PREVIEW = K.isPreview();
  K.applyLook(S);
  K.loadFont(S);

  const panel = document.getElementById('panel');
  const elTitle = document.getElementById('title');
  const elTime = document.getElementById('time');
  const elFill = document.getElementById('fill');
  const reduceMq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  const still = () => S.animasyon !== 'normal' || !!(reduceMq && reduceMq.matches);
  const pad = (n) => String(n).padStart(2, '0');

  // geriSayimSaat (local HH:MM) wins over geriSayimDk; a time that has passed today means tomorrow.
  // Otherwise the countdown starts when the page loads, so refreshing the OBS source restarts it.
  // Preview shows a clock part-way through so the design is visible at once.
  function target(now){
    if (PREVIEW) return now + 272000;
    if (S.geriSayimSaat) {
      const hm = S.geriSayimSaat.split(':');
      const d = new Date(now);
      d.setHours(Number(hm[0]), Number(hm[1]), 0, 0);
      if (d.getTime() <= now) d.setDate(d.getDate() + 1);
      return d.getTime();
    }
    return now + S.geriSayimDk * 60 * 1000;
  }
  const start = Date.now();
  const deadline = target(start);
  const baseMs = PREVIEW ? 300000 : deadline - start;

  elTitle.textContent = S.geriSayimBaslik || K.label(S, 'Birazdan başlıyoruz', 'Starting soon');
  K.debug({
    mode: PREVIEW ? 'preview' : S.geriSayimSaat ? 'clock ' + S.geriSayimSaat : S.geriSayimDk + ' min',
    target: new Date(deadline).toLocaleString()
  });

  // The title fades out, changes, and fades back in; with no motion it just changes.
  function setTitle(text){
    if (still() || S.animasyon === 'off') { elTitle.textContent = text; return; }
    elTitle.classList.add('is-swap');
    setTimeout(function(){ elTitle.textContent = text; elTitle.classList.remove('is-swap'); }, 200);
  }

  let shown = -1;
  let timer = null;

  function render(){
    const left = Math.max(0, deadline - Date.now());
    const secs = Math.ceil(left / 1000);
    if (secs === shown) return;
    shown = secs;
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
    elTime.textContent = (h > 0 ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
    const done = secs === 0;
    // The 1s linear slide aims one second ahead, so it lands as the next digit shows and never lags the clock.
    const ahead = still() ? left : Math.max(0, left - 1000);
    K.setFill(elFill, done ? 100 : 100 * ahead / baseMs);
    if (done) {
      // Done: a full bar, an accent edge and a pulsing 00:00 make it clear.
      panel.classList.add('is-done');
      setTitle(K.label(S, 'Başlıyoruz!', 'Going live!'));
      clearInterval(timer);
      timer = null;
    }
  }

  render();
  if (shown !== 0) timer = setInterval(render, 250);
  window.addEventListener('pagehide', function(){ if (timer !== null) clearInterval(timer); });
})();
</script>
</body>
</html>
